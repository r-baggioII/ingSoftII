<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Tech - Editar Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Tienda Tech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="producto_nuevo.html">Nuevo Producto</a></li>
        <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
        <li class="nav-item"><a class="nav-link" href="proveedor_nuevo.html">Nuevo Proveedor</a></li>
        <li class="nav-item"><a class="nav-link" href="ordenes.html">Órdenes de Compra</a></li>
        <li class="nav-item"><a class="nav-link" href="orden_nueva.html">Nueva Orden</a></li>
      </ul>
    </div>
  </div>
  </nav>

<div class="container mt-4">
  <h2>Editar Stock</h2>
  <form>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Producto</label>
        <input type="text" class="form-control" value="Notebook X" readonly>
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock actual</label>
        <input type="number" class="form-control" value="10" readonly>
      </div>
    </div>

    <hr class="my-4">

    <div class="mb-3">
      <label class="form-label">Motivo</label>
      <select class="form-select" id="motivoSelect">
        <option value="compra">Compra</option>
        <option value="venta">Venta</option>
        <option value="ajuste" selected>Ajuste</option>
      </select>
    </div>

    <div class="mb-3 d-none" id="ordenCompraGroup">
      <label class="form-label">Orden de compra</label>
      <select class="form-select" id="ordenCompraSelect">
        <option value="">Seleccione una orden</option>
        <option value="1">Orden #1 - Proveedor Mayorista (05/01/2022) - $33.00</option>
      </select>
      <div class="form-text">Asocie la orden que origina el ingreso de stock.</div>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Cantidad</label>
        <input type="number" class="form-control" placeholder="Ingrese cantidad">
        <div class="form-text">En venta se descuenta; en compra se suma.</div>
      </div>
      <div class="col-md-8">
        <label class="form-label">Detalle</label>
        <input type="text" class="form-control" placeholder="Ej: Compra OC-001, devolución, rotura, inventario, etc.">
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-secondary" href="productos.html">Cancelar</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const motivoSel = document.getElementById('motivoSelect');
  const ordenGroup = document.getElementById('ordenCompraGroup');
  function updateOrdenVisibility() {
    if (motivoSel.value === 'compra') {
      ordenGroup.classList.remove('d-none');
    } else {
      ordenGroup.classList.add('d-none');
    }
  }
  motivoSel.addEventListener('change', updateOrdenVisibility);
  updateOrdenVisibility();
</script>
</body>
</html>
