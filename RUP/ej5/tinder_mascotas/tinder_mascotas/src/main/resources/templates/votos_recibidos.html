<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Votos recibidos">
  <meta name="author" content="">
  <title>Tinder de Mascota - Votos Recibidos</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Catamaran:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lato:100,100i,300,300i,400,400i,700,700i,900,900i" rel="stylesheet">
  <link href="/css/one-page-wonder.min.css" th:href="@{/css/one-page-wonder.min.css}" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/" th:href="@{/}">Tinder de Mascota</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="/inicio" th:href="@{/inicio}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/votos/explorar" th:href="@{/votos/explorar}">Explorar</a></li>
          <li class="nav-item"><a class="nav-link" href="/logout" th:href="@{/logout}">Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header>
    <h1 style="margin-top:80px; text-align:center;">Votos recibidos por <span th:text="${mascota.nombre}"></span></h1>
  </header>

  <section>
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-12 order-lg-12">
          <div class="mb-3">
            <form method="GET" action="/votos/recibidos" th:action="@{/votos/recibidos}" class="form-inline">
              <label class="mr-2">Ver recibidos de:</label>
              <select class="form-control mr-2" name="idMascota" onchange="this.form.submit()">
                <option th:each="m : ${misMascotas}"
                        th:value="${m.id}"
                        th:text="${m.nombre}"
                        th:selected="${m.id == mascota.id}"></option>
              </select>
              <noscript><button type="submit" class="btn btn-primary">Cambiar</button></noscript>
            </form>
            <div class="mt-2">
              <a class="btn btn-outline-primary btn-sm" th:href="@{/votos/propios(idMascota=${mascota.id})}">Ver Propios</a>
              <a class="btn btn-outline-secondary btn-sm" th:href="@{/votos/explorar(idMascota1=${mascota.id})}">Explorar</a>
            </div>
            <p th:if="${error != null}" th:text="${error}" style="color:red;"></p>
          </div>

          <table class="table table-light table-hover">
            <thead>
              <tr class="bg-black text-white">
                <th>Fecha</th>
                <th>Quién votó</th>
                <th>Mi Mascota</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="v : ${votos}">
                <td th:text="${#dates.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                  <div class="d-flex align-items-center">
                    <img th:if="${v.mascota1 != null && v.mascota1.foto != null}" th:src="@{/foto/mascota/{id}(id=${v.mascota1.id})}" style="height:40px; width:40px; border-radius:50%; object-fit:cover; margin-right:8px;"/>
                    <img th:if="${v.mascota1 == null || v.mascota1.foto == null}" th:src="@{/img/m1.jpeg}" style="height:40px; width:40px; border-radius:50%; object-fit:cover; margin-right:8px;"/>
                    <span th:text="${v.mascota1 != null ? v.mascota1.nombre : 'N/D'}"></span>
                  </div>
                </td>
                <td>
                  <div class="d-flex align-items-center">
                    <img th:if="${v.mascota2 != null && v.mascota2.foto != null}" th:src="@{/foto/mascota/{id}(id=${v.mascota2.id})}" style="height:40px; width:40px; border-radius:50%; object-fit:cover; margin-right:8px;"/>
                    <img th:if="${v.mascota2 == null || v.mascota2.foto == null}" th:src="@{/img/m1.jpeg}" style="height:40px; width:40px; border-radius:50%; object-fit:cover; margin-right:8px;"/>
                    <span th:text="${v.mascota2 != null ? v.mascota2.nombre : 'N/D'}"></span>
                  </div>
                </td>
                <td>
                  <form method="POST" action="/votos/responder" th:action="@{/votos/responder}" style="display:inline;">
                    <input type="hidden" name="idVoto" th:value="${v.id}" />
                    <button type="submit" class="btn btn-success btn-sm">Dar Match</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-5 bg-black">
    <div class="container">
      <p class="m-0 text-center text-white small">Copyright &copy; Tinder Mascotas</p>
    </div>
  </footer>

  <script src="/vendor/jquery/jquery.min.js" th:src="@{/vendor/jquery/jquery.min.js}"></script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js" th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script src="/js/debug.js" th:src="@{/js/debug.js}"></script>
</body>

</html>
