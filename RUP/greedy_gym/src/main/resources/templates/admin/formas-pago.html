<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Admin | Formas de Pago</title>
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/font-awesome.css}">
  <link rel="stylesheet" th:href="@{/assets/css/templatemo-training-studio.css}">
  <link rel="stylesheet" th:href="@{/assets/css/panel-shared.css}">
</head>
<body>
<header class="header-area header-sticky">
  <div class="container"><div class="row"><div class="col-12">
    <nav class="main-nav">
      <a th:href="@{/}" class="logo">Greedy<em> Gym</em></a>
      <ul class="nav">
        <li><a th:href="@{/dashboard/admin2}">Dashboard</a></li>
  <li><a th:href="@{/admin/direcciones}">Direcciones</a></li>
        <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
      </ul>
      <a class='menu-trigger'><span>Menú</span></a>
    </nav>
  </div></div></div>
</header>

<section class="section panel-management" style="padding: 80px 0; background: #fff;">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <div class="section-heading">
          <h2>Formas de <em>Pago</em></h2>
          <img th:src="@{/assets/images/line-dec.png}" alt="waves">
          <p>Gestione los métodos de pago disponibles para facturación.</p>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="panel-card">
          <h5 class="panel-title"><i class="fa fa-plus-circle"></i> Nueva forma de pago</h5>
          <div class="panel-form">
            <div class="mb-3">
              <label class="panel-label">Tipo</label>
              <select id="fp-tipo" class="form-select panel-control">
                <option value="EFECTIVO">EFECTIVO</option>
                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                <option value="BILLETERA_VIRTUAL">BILLETERA_VIRTUAL</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="panel-label">Observación</label>
              <input id="fp-observacion" type="text" class="form-control panel-control" placeholder="Detalle opcional">
            </div>
            <div class="d-flex justify-content-end">
              <button id="fp-crear" class="btn main-button-panel">Agregar</button>
            </div>
            <div id="fp-alert" class="alert d-none" role="alert"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="panel-card">
          <h5 class="panel-title"><i class="fa fa-list"></i> Métodos disponibles</h5>
          <div class="panel-table table-responsive">
            <table class="table">
              <thead>
              <tr><th>Tipo</th><th>Observación</th><th></th></tr>
              </thead>
              <tbody id="fp-tabla">
                <tr><td colspan="3" class="text-muted text-center">Sin datos</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script th:src="@{/assets/js/jquery-2.1.0.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/admin/formas-pago.js}"></script>
</body>
</html>
