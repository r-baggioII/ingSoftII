<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Admin | Gestión de Usuarios</title>
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/font-awesome.css}">
  <link rel="stylesheet" th:href="@{/assets/css/templatemo-training-studio.css}">
  <link rel="stylesheet" th:href="@{/assets/css/panel-shared.css}">
</head>
<body th:data-context-path="@{/}">
<header class="header-area header-sticky">
  <div class="container"><div class="row"><div class="col-12">
    <nav class="main-nav">
      <a th:href="@{/}" class="logo">Greedy<em> Gym</em></a>
      <ul class="nav">
        <li><a th:href="@{/dashboard/admin2}">Dashboard</a></li>
  <li><a th:href="@{/admin/usuarios}">Usuarios</a></li>
        <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
      </ul>
      <a class='menu-trigger'><span>Menú</span></a>
    </nav>
  </div></div></div>
</header>

<section class="section panel-management">
  <div class="container">
    <div class="row"><div class="col-lg-10 offset-lg-1">
      <div class="section-heading">
        <h2>Gestión de Usuarios</h2>
        <img th:src="@{/assets/images/line-dec.png}" alt="waves">
        <p>Crear, consultar, modificar, dar de baja y asignar rol. Permite vincular Usuario con Socio o Empleado.</p>
      </div>
    </div></div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Crear/Editar Usuario</h5>
            <form id="usuario-form">
              <div class="mb-3">
                <label class="panel-label">Nombre de usuario</label>
                <input type="text" class="form-control panel-control" name="nombreUsuario" required>
              </div>
              <div class="mb-3">
                <label class="panel-label">Clave</label>
                <input type="password" class="form-control panel-control" name="clave" required>
              </div>
              <div class="mb-3">
                <label class="panel-label">Rol</label>
                <select class="form-select panel-control" name="rol" required>
                  <option value="ADMINISTRATIVO">Administrativo</option>
                  <option value="PROFESOR">Profesor</option>
                  <option value="SOCIO">Socio</option>
                </select>
              </div>

              <div class="mb-3 d-none" id="datos-socio">
                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control panel-control" name="socioNombre">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control panel-control" name="socioApellido">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control panel-control" name="socioFechaNacimiento">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Número de socio (opcional)</label>
                    <input type="number" class="form-control panel-control" name="socioNumero">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Tipo de documento</label>
                    <select class="form-select panel-control" name="socioTipoDocumento">
                      <option value="">Seleccione...</option>
                      <option th:each="tipo : ${T(com.example.greedy_gym.entidades.TipoDocumento).values()}"
                              th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Número de documento</label>
                    <input type="text" class="form-control panel-control" name="socioNumeroDocumento">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control panel-control" name="socioTelefono">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control panel-control" name="socioCorreo">
                  </div>
                  <div class="col-md-6">
                    <label class="panel-label">Dirección</label>
                    <select class="form-select panel-control" name="socioDireccionId">
                      <option value="">Seleccione una dirección...</option>
                      <option value="__CREATE_NEW__">+ Crear nueva dirección</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Sucursal</label>
                    <select class="form-select panel-control" name="socioSucursalId">
                      <option value="">Seleccione una sucursal...</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="nueva-direccion-panel d-none" id="nueva-direccion-form">
                <div class="card card-body">
                  <h6 class="mb-3">Nueva Dirección</h6>
                  <div class="row g-3">
                    <div class="col-md-8"><input type="text" class="form-control panel-control" name="nuevaDireccionCalle" placeholder="Calle"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaDireccionNumeracion" placeholder="Altura"></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaDireccionPais"><option value="">País</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaDireccionProvincia"><option value="">Provincia</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaDireccionDepartamento"><option value="">Departamento</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaDireccionLocalidad"><option value="">Localidad</option></select></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaDireccionBarrio" placeholder="Barrio"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaDireccionManzana" placeholder="Manzana/Piso"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaDireccionCasa" placeholder="Casa/Departamento"></div>
                    <div class="col-12"><textarea class="form-control panel-control" name="nuevaDireccionReferencia" rows="2" placeholder="Referencia"></textarea></div>
                  </div>
                </div>
              </div>

              <div class="mb-3 d-none" id="datos-empleado">
                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control panel-control" name="empleadoNombre">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control panel-control" name="empleadoApellido">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control panel-control" name="empleadoFechaNacimiento">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Tipo de documento</label>
                    <select class="form-select panel-control" name="empleadoTipoDocumento">
                      <option value="">Seleccione...</option>
                      <option th:each="tipo : ${T(com.example.greedy_gym.entidades.TipoDocumento).values()}"
                              th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Número de documento</label>
                    <input type="text" class="form-control panel-control" name="empleadoNumeroDocumento">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control panel-control" name="empleadoTelefono">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control panel-control" name="empleadoCorreo">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Tipo de empleado</label>
                    <select class="form-select panel-control" name="empleadoTipo">
                      <option value="">Seleccione...</option>
                      <option th:each="tipo : ${T(com.example.greedy_gym.entidades.TipoEmpleado).values()}"
                              th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="panel-label">Dirección</label>
                    <select class="form-select panel-control" name="empleadoDireccionId">
                      <option value="">Seleccione una dirección...</option>
                      <option value="__CREATE_NEW__">+ Crear nueva dirección</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Sucursal</label>
                    <select class="form-select panel-control" name="empleadoSucursalId">
                      <option value="">Seleccione una sucursal...</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="nueva-direccion-panel d-none" id="nueva-empleado-direccion-form">
                <div class="card card-body">
                  <h6 class="mb-3">Nueva Dirección</h6>
                  <div class="row g-3">
                    <div class="col-md-8"><input type="text" class="form-control panel-control" name="nuevaEmpleadoDireccionCalle" placeholder="Calle"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaEmpleadoDireccionNumeracion" placeholder="Altura"></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaEmpleadoDireccionPais"><option value="">País</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaEmpleadoDireccionProvincia"><option value="">Provincia</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaEmpleadoDireccionDepartamento"><option value="">Departamento</option></select></div>
                    <div class="col-md-3"><select class="form-select panel-control" name="nuevaEmpleadoDireccionLocalidad"><option value="">Localidad</option></select></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaEmpleadoDireccionBarrio" placeholder="Barrio"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaEmpleadoDireccionManzana" placeholder="Manzana/Piso"></div>
                    <div class="col-md-4"><input type="text" class="form-control panel-control" name="nuevaEmpleadoDireccionCasa" placeholder="Casa/Departamento"></div>
                    <div class="col-12"><textarea class="form-control panel-control" name="nuevaEmpleadoDireccionReferencia" rows="2" placeholder="Referencia"></textarea></div>
                  </div>
                </div>
              </div>

              <div class="d-flex gap-2">
                <!-- JS: POST /api/usuarios incluyendo datos de socio/empleado según la selección -->
                <button type="submit" class="btn main-button-panel">Guardar</button>
                <button type="button" class="btn btn-outline-secondary" id="usuario-reset">Limpiar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-10 offset-lg-1">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Búsqueda y acciones</h5>
            <div class="row g-2 mb-3">
              <div class="col-md-8"><input type="text" class="form-control panel-control" id="usuario-search" placeholder="Buscar por nombre de usuario"></div>
              <div class="col-md-4"><button class="btn main-button-panel w-100" id="usuario-refresh">Buscar</button></div>
            </div>
            <!-- JS: GET /api/usuarios?search=... ; render tabla; acciones PUT/DELETE -->
            <div class="panel-table table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr><th>Usuario</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody id="usuario-table-body">
                  <!-- JS: filas -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script th:src="@{/assets/js/jquery-2.1.0.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/admin/usuarios.js}"></script>
</body>
</html>
