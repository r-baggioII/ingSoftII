<!-- index.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feed - SocialApp (Prototipo)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .app-header { height:56px; }
    .post-img { width:100%; height:260px; object-fit:cover; border-radius:6px; }
    .like-btn.liked { color:#e0245e; font-weight:700; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #dee2e6; }
  </style>
</head>
<body>
<nav class="navbar bg-white shadow-sm app-header">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">SocialApp</span>
    <div>
      <a href="create_post.html" class="btn btn-sm btn-primary">+ Publicar</a>
    </div>
  </div>
</nav>

<main class="container py-3 pb-6">
  <!-- sample post card -->
  <div id="feed" class="d-grid gap-3">
    <!-- Post template - repeat -->
    <div class="card">
      <div class="card-body p-3">
        <div class="d-flex align-items-center mb-2">
          <img src="https://via.placeholder.com/44" class="rounded-circle me-2" width="44" height="44">
          <div>
            <div class="fw-bold">juan_p</div>
            <small class="text-muted">hace 2 horas</small>
          </div>
        </div>
        <img src="https://picsum.photos/600/400?random=1" class="post-img mb-2" alt="imagen-publicacion">
        <p class="mb-2">Atardecer en la ciudad 🌆</p>
        <div class="d-flex align-items-center">
          <button class="btn btn-sm like-btn me-2" data-liked="false" onclick="toggleLike(this)">♡ Me gusta <span class="badge bg-light text-dark ms-2" id="likes-1">12</span></button>
          <a class="btn btn-sm btn-outline-secondary me-2" href="post_detail.html">💬 Comentarios</a>
        </div>
      </div>
    </div>

    <!-- another post -->
    <div class="card">
      <div class="card-body p-3">
        <div class="d-flex align-items-center mb-2">
          <img src="https://via.placeholder.com/44/888" class="rounded-circle me-2" width="44" height="44">
          <div>
            <div class="fw-bold">maria94</div>
            <small class="text-muted">hace 1 día</small>
          </div>
        </div>
        <img src="https://picsum.photos/600/400?random=2" class="post-img mb-2" alt="imagen-publicacion">
        <p class="mb-2">Café y trabajo ☕️</p>
        <div class="d-flex align-items-center">
          <button class="btn btn-sm like-btn me-2" data-liked="false" onclick="toggleLike(this)">♡ Me gusta <span class="badge bg-light text-dark ms-2" id="likes-2">3</span></button>
          <a class="btn btn-sm btn-outline-secondary me-2" href="post_detail.html">💬 Comentarios</a>
        </div>
      </div>
    </div>

  </div>
</main>

<nav class="bottom-nav d-flex justify-content-around py-2">
  <a href="index.html" class="text-center small text-decoration-none">🏠<div>Feed</div></a>
  <a href="messages.html" class="text-center small text-decoration-none">✉️<div>Mensajes</div></a>
  <a href="profile.html" class="text-center small text-decoration-none">👤<div>Perfil</div></a>
</nav>

<script>
function toggleLike(btn){
  const liked = btn.getAttribute('data-liked') === 'true';
  const badge = btn.querySelector('.badge');
  let n = parseInt(badge.textContent);
  if(!liked) { n += 1; btn.classList.add('liked'); btn.innerHTML = '♥ Me gusta <span class="badge bg-light text-dark ms-2">'+n+'</span>'; btn.setAttribute('data-liked','true'); }
  else { n = Math.max(0,n-1); btn.classList.remove('liked'); btn.innerHTML = '♡ Me gusta <span class="badge bg-light text-dark ms-2">'+n+'</span>'; btn.setAttribute('data-liked','false'); }
}
</script>

</body>
</html>
