<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión - SocialApp (Prototipo)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .box { max-width:420px; margin:60px auto; }
  </style>
</head>
<body>
  <main class="box">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Iniciar sesión</h4>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Email o usuario</label>
            <input id="identifier" class="form-control" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input id="password" class="form-control" type="password" minlength="8" required>
          </div>
          <div class="d-grid mb-2">
            <button class="btn btn-primary" type="submit">Entrar</button>
          </div>
          <div class="text-center">
            <small>¿No tienes cuenta? <a href="register.html">Regístrate</a></small>
          </div>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">Usuario demo: <strong>demo@demo.com</strong> / contraseña: <strong>password123</strong></p>
  </main>

<script>
/*
Simple auth using localStorage for prototipo.
Estructura de users en localStorage: [{username,email,passwordHash}]
(notar: password en texto plano aquí sólo para prototipo)
*/
(function initDemoUser(){
  const users = JSON.parse(localStorage.getItem('users')||'[]');
  const demoExists = users.some(u => u.email === 'demo@demo.com');
  if(!demoExists){
    users.push({ username: 'demo', email: 'demo@demo.com', password: 'password123' });
    localStorage.setItem('users', JSON.stringify(users));
  }
})();

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const id = document.getElementById('identifier').value.trim();
  const pwd = document.getElementById('password').value;
  if(pwd.length < 8){ alert('La contraseña debe tener al menos 8 caracteres'); return; }

  const users = JSON.parse(localStorage.getItem('users')||'[]');
  const user = users.find(u => u.email === id || u.username === id);
  if(!user){ alert('Usuario no encontrado. Regístrate.'); return; }
  if(user.password !== pwd){ alert('Contraseña incorrecta'); return; }

  // login ok
  localStorage.setItem('sessionUser', JSON.stringify({ username: user.username, email: user.email }));
  // redirigir al feed (index.html)
  window.location = 'index.html';
});
</script>
</body>
</html>
