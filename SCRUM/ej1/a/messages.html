<!-- messages.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mensajes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f8f9fa}.app-header{height:56px}.chat-panel{height:70vh; overflow:auto}</style>
</head>
<body>
<nav class="navbar bg-white shadow-sm app-header">
  <div class="container-fluid">
    <a href="index.html" class="btn btn-link">&larr;</a>
    <span class="navbar-brand mb-0 h1">Mensajes</span>
  </div>
</nav>

<main class="container py-3">
  <div class="row g-2">
    <div class="col-4">
      <div class="list-group" id="convos">
        <a href="#" class="list-group-item list-group-item-action active">juan_p <div class="small text-muted">Último: Hola</div></a>
        <a href="#" class="list-group-item list-group-item-action">maria94 <div class="small text-muted">Último: OK</div></a>
      </div>
    </div>
    <div class="col-8">
      <div class="card">
        <div class="card-body chat-panel p-3" id="chatArea">
          <!-- messages -->
          <div class="mb-2"><strong>juan_p</strong><div class="bg-light rounded p-2 d-inline-block">Hola, cómo estás?</div><small class="text-muted d-block">ahora</small></div>
          <div class="text-end mb-2"><strong>yo</strong><div class="bg-primary text-white rounded p-2 d-inline-block">Bien! ¿y tú?</div><small class="text-muted d-block">ahora</small></div>
        </div>
        <div class="card-footer p-2">
          <div class="d-flex">
            <input id="msgInput" class="form-control me-2" placeholder="Escribe un mensaje...">
            <button class="btn btn-primary" onclick="sendMsg()">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
function sendMsg(){
  const t = document.getElementById('msgInput').value.trim();
  if(!t) return;
  const area = document.getElementById('chatArea');
  const el = document.createElement('div');
  el.className = 'text-end mb-2';
  el.innerHTML = `<strong>yo</strong><div class="bg-primary text-white rounded p-2 d-inline-block">${t}</div><small class="text-muted d-block">ahora</small>`;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
  document.getElementById('msgInput').value='';
}
</script>
</body>
</html>
