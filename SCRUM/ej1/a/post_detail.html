<!-- post_detail.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publicación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f8f9fa}.app-header{height:56px}.post-img{width:100%;height:320px;object-fit:cover}</style>
</head>
<body>
<nav class="navbar bg-white shadow-sm app-header">
  <div class="container-fluid">
    <a href="index.html" class="btn btn-link">&larr;</a>
    <span class="navbar-brand mb-0 h1">Publicación</span>
  </div>
</nav>

<main class="container py-3">
  <div class="card">
    <div class="card-body">
      <div class="d-flex mb-2">
        <img src="https://via.placeholder.com/44" class="rounded-circle me-2">
        <div>
          <div class="fw-bold">juan_p</div>
          <small class="text-muted">hace 2 horas</small>
        </div>
      </div>
      <img src="https://picsum.photos/800/600?random=5" class="post-img mb-3">
      <p>Atardecer en la ciudad. ¿Quién más ama estas vistas?</p>

      <div class="d-flex align-items-center mb-3">
        <button id="likeBtn" class="btn btn-sm btn-outline-primary me-2" onclick="toggleLike()">♡ Me gusta <span id="likesCount" class="badge bg-light text-dark ms-2">5</span></button>
      </div>

      <hr>
      <h6>Comentarios</h6>
      <div id="commentsList" class="mb-3">
        <!-- comments rendered here -->
      </div>

      <div class="input-group">
        <input id="commentInput" type="text" class="form-control" placeholder="Escribe un comentario...">
        <button class="btn btn-primary" onclick="addComment()">Enviar</button>
      </div>
    </div>
  </div>
</main>

<script>
const comments = [
  {author:'maria94', text:'Precioso!'},
  {author:'luis', text:'Qué lugar es ese?'}
];
const list = document.getElementById('commentsList');
function renderComments(){
  list.innerHTML = '';
  comments.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'mb-2';
    el.innerHTML = `<strong>${c.author}</strong> <small class="text-muted"> · ahora</small><div>${c.text}</div>`;
    list.appendChild(el);
  });
}
renderComments();

function addComment(){
  const val = document.getElementById('commentInput').value.trim();
  if(!val) return alert('Escribe algo');
  comments.push({author:'yo', text: val});
  document.getElementById('commentInput').value='';
  renderComments();
}

let liked = false;
function toggleLike(){
  liked = !liked;
  const btn = document.getElementById('likeBtn');
  const badge = document.getElementById('likesCount');
  let n = parseInt(badge.textContent);
  if(liked){ n++; btn.className='btn btn-sm btn-primary me-2'; btn.innerHTML = '♥ Me gusta <span id="likesCount" class="badge bg-light text-dark ms-2">'+n+'</span>'; }
  else { n = Math.max(0,n-1); btn.className='btn btn-sm btn-outline-primary me-2'; btn.innerHTML = '♡ Me gusta <span id="likesCount" class="badge bg-light text-dark ms-2">'+n+'</span>'; }
}
</script>
</body>
</html>
