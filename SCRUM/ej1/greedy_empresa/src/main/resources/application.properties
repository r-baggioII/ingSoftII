spring.datasource.url=jdbc:mariadb://localhost:3306/greedy_empresa
spring.datasource.username=juan
spring.datasource.password=greedy

spring.thymeleaf.cache=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Habilitar información detallada de errores
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
logging.level.com.example.greedy_empresa=DEBUG
