<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">
<head>
  <title>Dashboard</title>
</head>
<body>
<section th:fragment="content">
  <div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Panel principal</h1>
  </div>

  <div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-primary shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Usuarios activos</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${usuariosActivos}">0</div>
            </div>
            <div class="col-auto"><i class="fas fa-users fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tus otras cards iguales a antes… -->
    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-success shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Empresas</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${empresasActivas}">0</div>
            </div>
            <div class="col-auto"><i class="fas fa-industry fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-info shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Proveedores</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${proveedoresActivos}">0</div>
            </div>
            <div class="col-auto"><i class="fas fa-truck fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-warning shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Países</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${paisesActivos}">0</div>
            </div>
            <div class="col-auto"><i class="fas fa-globe-americas fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
