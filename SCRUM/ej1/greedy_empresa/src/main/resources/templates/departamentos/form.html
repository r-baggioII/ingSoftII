<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

<head>
    <title th:text="${departamento.id} == null ? 'Nuevo Departamento' : 'Editar Departamento'"></title>
</head>

<body>
<section th:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800"
            th:text="${departamento.id} == null ? 'Nuevo Departamento' : 'Editar Departamento'"></h1>
        <a class="btn btn-secondary" th:href="@{/departamentos}">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="${departamento.id} == null ? @{/departamentos} : @{'/departamentos/' + ${departamento.id}}"
                method="post" th:object="${departamento}">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                    th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                <input type="hidden" th:field="*{id}">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="paisId">País</label>
                        <select class="form-control" id="paisId" name="paisId" th:value="${paisId}" required>
                            <option value="">Seleccione un país</option>
                            <option th:each="pais : ${paises}" th:value="${pais.id}" th:selected="${pais.id == paisId}"
                                th:text="${pais.nombre}"></option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="provinciaId">Provincia</label>
                        <select class="form-control" id="provinciaId" name="provinciaId" th:value="${provinciaId}"
                            required>
                            <option value="">Seleccione una provincia</option>
                            <option th:each="provincia : ${provinciasSeleccionadas}" th:value="${provincia.id}"
                                th:selected="${provincia.id == provinciaId}" th:text="${provincia.nombre}">
                            </option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>
</section>
</body>

</html>
