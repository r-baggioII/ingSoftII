<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${empresa.id} == null ? 'Nueva empresa' : 'Editar empresa'"></title>
</head>
<body>
<section th:fragment="content">
    <section class="content-header">
        <h1 th:text="${empresa.id} == null ? 'Nueva empresa' : 'Editar empresa'"></h1>
        <div class="pull-right">
            <a class="btn btn-default" th:href="@{/empresas}"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </section>
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <form th:action="${empresa.id} == null ? @{/empresas} : @{'/empresas/' + ${empresa.id}}" method="post"
                      th:object="${empresa}">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                         th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group">
                        <label for="razonSocial">Razón social</label>
                        <input type="text" class="form-control" id="razonSocial" th:field="*{razonSocial}" required>
                        <p class="text-danger" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></p>
                    </div>
                    
                    <h4>Direcciones</h4>
                    <div id="direcciones-container">
                        <div th:each="direccion, iterStat : ${empresa.direcciones}" class="direccion-item well" th:attr="data-index=${iterStat.index}">
                            <input type="hidden" th:field="*{direcciones[__${iterStat.index}__].id}" />
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label th:for="'calle' + ${iterStat.index}">Calle</label>
                                        <input type="text" class="form-control" th:id="'calle' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].calle}" required>
                                        <p class="text-danger" th:if="${#fields.hasErrors('direcciones[' + __${iterStat.index}__ + '].calle')}" th:errors="*{direcciones[__${iterStat.index}__].calle}"></p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label th:for="'numero' + ${iterStat.index}">Número</label>
                                        <input type="text" class="form-control" th:id="'numero' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].numero}" required>
                                        <p class="text-danger" th:if="${#fields.hasErrors('direcciones[' + __${iterStat.index}__ + '].numero')}" th:errors="*{direcciones[__${iterStat.index}__].numero}"></p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label th:for="'numeroInterno' + ${iterStat.index}">Nro. Interno</label>
                                        <input type="text" class="form-control" th:id="'numeroInterno' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].numeroInterno}">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label th:for="'localidad' + ${iterStat.index}">Localidad</label>
                                        <select class="form-control" th:id="'localidad' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].localidad}" required>
                                            <option value="">Seleccionar localidad...</option>
                                            <option th:each="localidad : ${localidades}" th:value="${localidad.id}" th:text="${localidad.nombre + ' (' + localidad.departamento.nombre + ', ' + localidad.departamento.provincia.nombre + ')'}">Localidad</option>
                                        </select>
                                        <p class="text-danger" th:if="${#fields.hasErrors('direcciones[' + __${iterStat.index}__ + '].localidad')}" th:errors="*{direcciones[__${iterStat.index}__].localidad}"></p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label th:for="'referencia' + ${iterStat.index}">Referencia</label>
                                        <input type="text" class="form-control" th:id="'referencia' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].referencia}">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label th:for="'latitud' + ${iterStat.index}">Latitud (Google Maps)</label>
                                        <input type="text" class="form-control" th:id="'latitud' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].latitud}" placeholder="-34.603722">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label th:for="'longitud' + ${iterStat.index}">Longitud (Google Maps)</label>
                                        <input type="text" class="form-control" th:id="'longitud' + ${iterStat.index}" th:field="*{direcciones[__${iterStat.index}__].longitud}" placeholder="-58.381592">
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-danger btn-xs remove-direccion">Eliminar dirección</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-success btn-sm" id="add-direccion">Agregar dirección</button>
                    
                    <div class="box-footer">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <div th:insert="~{fragments/direcciones-js :: direcciones-js}"></div>
</section>
</body>
</html>
