<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

<head>
    <title>Empresas</title>
</head>

<body>
<section th:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Empresas</h1>
        <a class="btn btn-primary" th:href="@{/empresas/new}">
            <i class="fas fa-plus"></i> Nueva Empresa
        </a>
    </div>
    <div th:insert="~{fragments/alerts :: alerts}"></div>
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <form class="form-inline" method="get" th:action="@{/empresas}">
                <div class="form-group mr-2 mb-2">
                    <input type="text" class="form-control" placeholder="Buscar por razón social" name="filtro"
                        th:value="${filtro}">
                </div>
                <button type="submit" class="btn btn-outline-primary mb-2">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </form>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th>Razón social</th>
                            <th>Direcciones</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${page.empty}">
                            <td colspan="3" class="text-center">No hay empresas registradas.</td>
                        </tr>
                        <tr th:each="empresa : ${page.content}">
                            <td th:text="${empresa.razonSocial}">Greedy Corp</td>
                            <td th:text="${empresa.direcciones != null ? empresa.direcciones.size() : 0}">0</td>
                            <td class="text-right">
                                <a class="btn btn-sm btn-outline-primary"
                                    th:href="@{'/empresas/' + ${empresa.id} + '/edit'}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{'/empresas/' + ${empresa.id} + '/delete'}" method="post" class="d-inline"
                                    onsubmit="return confirm('¿Confirma eliminar la empresa seleccionada?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:insert="~{fragments/pagination :: pagination(${page}, '/empresas')}"></div>
        </div>
    </div>
</section>
</body>

</html>
