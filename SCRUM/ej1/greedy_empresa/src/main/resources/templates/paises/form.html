<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

<head>
    <title th:text="${pais.id} == null ? 'Nuevo País' : 'Editar País'"></title>
</head>

<body>
<section th:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${pais.id} == null ? 'Nuevo País' : 'Editar País'"></h1>
        <a class="btn btn-secondary" th:href="@{/paises}">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="${pais.id} == null ? @{/paises} : @{'/paises/' + ${pais.id}}" method="post"
                th:object="${pais}">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                    th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                <input type="hidden" th:field="*{id}">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>
</section>
</body>

</html>
