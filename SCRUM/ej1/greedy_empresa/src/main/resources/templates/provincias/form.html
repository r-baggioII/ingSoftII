<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

<head>
    <title th:text="${provincia.id} == null ? 'Nueva Provincia' : 'Editar Provincia'"></title>
</head>

<body>
<section th:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800" th:text="${provincia.id} == null ? 'Nueva Provincia' : 'Editar Provincia'"></h1>
        <a class="btn btn-secondary" th:href="@{/provincias}">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="${provincia.id} == null ? @{/provincias} : @{'/provincias/' + ${provincia.id}}" method="post"
                th:object="${provincia}">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                    th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                <input type="hidden" th:field="*{id}">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-group">
                    <label for="paisId">País</label>
                    <select class="form-control" id="paisId" name="paisId" th:value="${paisId}" required>
                        <option value="">Seleccione un país</option>
                        <option th:each="pais : ${paises}" th:value="${pais.id}" th:selected="${pais.id == paisId}"
                            th:text="${pais.nombre}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>
</section>
</body>

</html>
