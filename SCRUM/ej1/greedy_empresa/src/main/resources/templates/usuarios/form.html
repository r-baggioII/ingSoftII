<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${usuario.id} == null ? 'Nuevo usuario' : 'Editar usuario'"></title>
</head>
<body>
<section th:fragment="content">
    <section class="content-header">
        <h1 th:text="${usuario.id} == null ? 'Nuevo usuario' : 'Editar usuario'"></h1>
        <div class="pull-right">
            <a class="btn btn-default" th:href="@{/usuarios}"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </section>
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <form th:action="${usuario.id} == null ? @{/usuarios} : @{'/usuarios/' + ${usuario.id}}" method="post" th:object="${usuario}">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                         th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                    <input type="hidden" th:field="*{id}" />
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="username">Usuario</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                                <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="rol">Rol</label>
                                <select class="form-control" id="rol" th:field="*{rol}" required>
                                    <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}">ADMIN</option>
                                </select>
                                <p class="text-danger" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                       th:attr="${usuario.id} != null ? 'placeholder=Dejar en blanco para mantener' : 'required=required'">
                                <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="confirmPassword">Confirmación</label>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                       th:attr="${usuario.id} != null ? 'placeholder=Dejar en blanco para mantener' : 'required=required'">
                                <p class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="box-footer">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</section>
</body>
</html>
