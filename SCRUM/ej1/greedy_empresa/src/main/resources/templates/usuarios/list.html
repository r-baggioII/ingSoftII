<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

<head>
    <title>Usuarios</title>
</head>

<body>
<section th:fragment="content">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/new}">
            <i class="fas fa-plus"></i> Nuevo Usuario
        </a>
    </div>
    <div th:insert="~{fragments/alerts :: alerts}"></div>
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <form class="form-inline" method="get" th:action="@{/usuarios}">
                <div class="form-group mr-2 mb-2">
                    <input type="text" class="form-control" placeholder="Buscar por usuario" name="filtro"
                        th:value="${filtro}">
                </div>
                <button type="submit" class="btn btn-outline-primary mb-2">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </form>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Persona</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${page.empty}">
                            <td colspan="4" class="text-center">No hay usuarios registrados.</td>
                        </tr>
                        <tr th:each="usuario : ${page.content}">
                            <td th:text="${usuario.username}">admin</td>
                            <td th:text="${usuario.rol}">ADMIN</td>
                            <td th:text="${usuario.persona != null ? usuario.persona.nombre + ' ' + usuario.persona.apellido : '-'}">-</td>
                            <td class="text-right">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{'/usuarios/' + ${usuario.id} + '/edit'}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{'/usuarios/' + ${usuario.id} + '/delete'}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('¿Confirma eliminar el usuario seleccionado?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:insert="~{fragments/pagination :: pagination(${page}, '/usuarios')}"></div>
        </div>
    </div>
</section>
</body>

</html>
