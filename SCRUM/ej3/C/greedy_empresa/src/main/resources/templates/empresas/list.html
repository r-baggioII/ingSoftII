<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Empresas</title>
</head>
<body>
<section th:fragment="content">
    <section class="content-header">
        <h1>Empresas</h1>
        <div class="pull-right">
            <a class="btn btn-success" th:href="@{/empresas/excel}" title="Descargar Excel con todas las empresas">
                <i class="fa fa-file-excel-o"></i> Descargar Excel
            </a>
            <a class="btn btn-primary" th:href="@{/empresas/new}"><i class="fa fa-plus"></i> Nueva empresa</a>
        </div>
    </section>
    <section class="content">
        <div th:insert="~{fragments/alerts :: alerts}"></div>
        <div class="box box-primary">
            <div class="box-header with-border">
                <form class="form-inline" method="get" th:action="@{/empresas}">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Buscar por razón social" name="filtro"
                               th:value="${filtro}">
                    </div>
                    <button type="submit" class="btn btn-default"><i class="fa fa-search"></i> Buscar</button>
                </form>
            </div>
            <div class="box-body table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Razón social</th>
                            <th>Ubicación</th>
                            <th class="text-center" style="width:160px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${page.empty}">
                            <td colspan="3" class="text-center">No hay empresas registradas.</td>
                        </tr>
                        <tr th:each="empresa : ${page.content}">
                            <td th:text="${empresa.razonSocial}">Greedy Corp</td>
                            <td>
                                <th:block th:each="direccion : ${empresa.direcciones}">
                                    <a th:if="${direccion.hasGeoPoint()}"
                                       class="btn btn-xs btn-success" target="_blank" 
                                       th:href="${direccion.googleMapsUrl}" 
                                       title="Ver en Google Maps">
                                        <i class="fa fa-map-marker"></i>
                                    </a>
                                    <th:block th:if="${direccion.hasGeoPoint()}" th:remove="all-but-first"></th:block>
                                </th:block>
                            </td>
                            <td class="text-center">
                                <a class="btn btn-xs btn-default" th:href="@{'/empresas/' + ${empresa.id} + '/edit'}" title="Editar">
                                    <i class="fa fa-pencil"></i>
                                </a>
                                <form th:action="@{'/empresas/' + ${empresa.id} + '/delete'}" method="post" style="display:inline-block;"
                                      onsubmit="return confirm('¿Confirma eliminar la empresa seleccionada?');">
                                    <button class="btn btn-xs btn-danger" type="submit" title="Eliminar">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="box-footer clearfix" th:insert="~{fragments/pagination :: pagination(${page}, '/empresas')}"></div>
        </div>
    </section>
</section>
</body>
</html>
