<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible">
        <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
        <span th:text="${successMessage}">Operación exitosa</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible">
        <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
        <span th:text="${errorMessage}">Ocurrió un error</span>
    </div>
</th:block>
