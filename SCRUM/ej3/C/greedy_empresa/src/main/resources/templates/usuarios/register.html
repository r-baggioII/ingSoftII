<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Registrarse</title>
</head>
<body>
<section th:fragment="content">
    <section class="content-header">
        <h1>Crear cuenta</h1>
        <div class="pull-right">
            <a class="btn btn-default" th:href="@{/login}"><i class="fa fa-arrow-left"></i> Ingresar</a>
        </div>
    </section>
    <section class="content">
        <div class="row">
            <div class="col-md-4 col-md-offset-4">
                <div class="box box-primary">
                    <div class="box-body">
                        <form th:action="@{/register}" method="post" th:object="${usuario}">
                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"
                                 th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></div>
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{rol}" />
                            <div class="form-group">
                                <label for="username">Usuario</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                                <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" required>
                                <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirmación</label>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                                <p class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                            </div>
                            <div class="box-footer">
                                <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</section>
</body>
</html>
