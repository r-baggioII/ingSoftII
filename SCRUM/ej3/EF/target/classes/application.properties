spring.application.name=shopping-cart

# ---- DataSource (MariaDB) ----
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/shopping_cart?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=diego
spring.datasource.password=greedy

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=trueon.name=shopping-cart

