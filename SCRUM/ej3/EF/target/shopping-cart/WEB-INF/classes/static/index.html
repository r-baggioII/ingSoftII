<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Carrito de Compras - Mi Tienda</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .product-card {
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .cart-card {
            position: sticky;
            top: 20px;
        }
        .total-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-shopping-cart"></i> Mi Tienda</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8">
                <h1 class="mb-4"><i class="fas fa-box-open"></i> Nuestros Productos</h1>
                <div id="product-list" class="row">
                    <!-- Products will be loaded here -->
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card cart-card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-shopping-basket"></i> Mi Carrito</h5>
                    </div>
                    <div class="card-body">
                        <ul id="cart-items" class="list-group mb-3">
                            <!-- Cart items will be loaded here -->
                        </ul>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="total-price">Total: $<span id="cart-total">0.00</span></span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button id="checkout-btn" class="btn btn-success btn-block">
                            <i class="fas fa-credit-card"></i> Finalizar Compra
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <h2><i class="fas fa-map-marked-alt"></i> Ubicación de Proveedores</h2>
                <div id="map" style="height: 400px;"></div>
            </div>
        </div>
    </div>

    <!-- Modal para mapa de proveedor -->
    <div class="modal fade" id="supplierMapModal" tabindex="-1" role="dialog" aria-labelledby="supplierMapModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="supplierMapModalLabel">Ubicación del Proveedor</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="supplier-map" style="height: 400px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
