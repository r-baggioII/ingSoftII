<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Greedy Videojuegos - Administración">
    <meta name="keywords" content="Videojuegos, gaming, tienda, admin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Administrar Videojuegos - Greedy Videojuegos</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/elegant-icons.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/plyr.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/nice-select.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/owl.carousel.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/slicknav.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css">
    <style>
        .admin-table {
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        .admin-table table {
            margin-bottom: 0;
        }
        .admin-table thead {
            background: linear-gradient(to right, #e53637 0%, #e53637 100%);
            color: #fff;
        }
        .admin-table thead th {
            border: none;
            padding: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            font-family: "Oswald", sans-serif;
        }
        .admin-table tbody td {
            padding: 20px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-family: "Mulish", sans-serif;
        }
        .admin-table tbody tr:hover {
            background: #f8f8f8;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-active {
            background: #28a745;
            color: #fff;
        }
        .status-inactive {
            background: #dc3545;
            color: #fff;
        }
        .btn-action {
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-edit {
            background: #ffc107;
            color: #000;
            border: none;
        }
        .btn-edit:hover {
            background: #e0a800;
            color: #000;
        }
        .btn-delete {
            background: #e53637;
            color: #fff;
            border: none;
        }
        .btn-delete:hover {
            background: #c42b2c;
        }
        .section-header {
            padding: 40px 0 30px;
        }
        .section-header h2 {
            font-family: "Oswald", sans-serif;
            font-weight: 700;
            color: #fff;
            margin: 0;
            font-size: 36px;
        }
        .add-btn {
            background: #e53637;
            color: #fff;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: 600;
            font-family: "Oswald", sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .add-btn:hover {
            background: #c42b2c;
            color: #fff;
            text-decoration: none;
        }
        .add-btn i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- Header Section Begin -->
    <nav th:replace="components/navbar :: nav_bar"></nav>
    <!-- Header End -->

    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__links">
                        <a th:href="@{/inicio}"><i class="fa fa-home"></i> Inicio</a>
                        <span>Administrar Videojuegos</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- CRUD Section Begin -->
    <section class="product spad">
        <div class="container">
            <div class="section-header">
                <div class="row align-items-center">
                    <div class="col-lg-6 col-md-6">
                        <h2>Gestión de Videojuegos</h2>
                    </div>
                    <div class="col-lg-6 col-md-6 text-right">
                        <a th:href="@{/formulario/videojuego/0}" class="add-btn">
                            <i class="fa fa-plus"></i> Agregar Videojuego
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <div class="admin-table">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Título</th>
                                    <th scope="col">Precio</th>
                                    <th scope="col">Stock</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="videojuego : ${videojuegos}">
                                    <td><strong>#<span th:text="${videojuego.id}">1</span></strong></td>
                                    <td th:text="${videojuego.titulo}">Título</td>
                                    <td><strong>$<span th:text="${videojuego.precio}">0</span></strong></td>
                                    <td th:text="${videojuego.stock}">0</td>
                                    <td>
                                        <span th:if="${videojuego.activo}" class="status-badge status-active">Activo</span>
                                        <span th:unless="${videojuego.activo}" class="status-badge status-inactive">Inactivo</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/formulario/videojuego/{id}(id=${videojuego.id})}" class="btn btn-action btn-edit">
                                            <i class="fa fa-edit"></i> Editar
                                        </a>
                                        <a th:if="${videojuego.activo}" 
                                           th:href="@{/eliminar/videojuego/{id}(id=${videojuego.id})}" 
                                           class="btn btn-action btn-delete"
                                           onclick="return confirm('¿Estás seguro de eliminar este videojuego?');">
                                            <i class="fa fa-trash"></i> Eliminar
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- CRUD Section End -->

    <!-- Footer Section Begin -->
    <footer class="footer">
        <div class="page-up">
            <a href="#" id="scrollToTopButton"><span class="arrow_carrot-up"></span></a>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-lg-3">
                    <div class="footer__logo">
                        <a th:href="@{/inicio}"><img th:src="@{/img/logo.png}" alt=""></a>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="footer__nav">
                        <ul>
                            <li class="active"><a th:href="@{/inicio}">Inicio</a></li>
                            <li><a th:href="@{/crud}">Administrar</a></li>
                            <li><a href="#">Contacto</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-lg-3">
                    <p>
                        Copyright &copy;<script>document.write(new Date().getFullYear());</script> 
                        Greedy Videojuegos. Todos los derechos reservados.
                    </p>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer Section End -->

    <!-- Search model Begin -->
    <div class="search-model">
        <div class="h-100 d-flex align-items-center justify-content-center">
            <div class="search-close-switch"><i class="icon_close"></i></div>
            <form class="search-model-form" th:action="@{/busqueda}" method="get">
                <input type="text" id="search-input" name="query" placeholder="Buscar videojuegos.....">
            </form>
        </div>
    </div>
    <!-- Search model end -->

    <!-- Js Plugins -->
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:src="@{/js/jquery.nice-select.min.js}"></script>
    <script th:src="@{/js/mixitup.min.js}"></script>
    <script th:src="@{/js/jquery.slicknav.js}"></script>
    <script th:src="@{/js/owl.carousel.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
