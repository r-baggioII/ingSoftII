spring.application.name=biblioteca
spring.main.allow-bean-definition-overriding=true

# MySQL (config original)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/demospringsecuritybibliotecadb?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

# Cambiar puerto para evitar conflicto cuando 8080 está ocupado
server.port=8081

# Debug de Spring Security para ver flujo de autenticación en consola
logging.level.org.springframework.security=DEBUG
# Incluir mensajes de error en respuestas (útil para 4xx/5xx)
server.error.include-message=always