
# Application name (overridable via env)
spring.application.name=${SPRING_APPLICATION_NAME:greedy_gym}

# ---- DataSource (MariaDB en 3306) ----
# Use environment variables in Docker; defaults kept for local dev
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/greedy_gym?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminAdmin}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.naming.physical-strategy=${SPRING_JPA_NAMING_STRATEGY:org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl}

# ---- Mail (use env vars in prod) ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:greedyteam0@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:upiz bhvd orss pqls}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.default-encoding=${SPRING_MAIL_DEFAULT_ENCODING:UTF-8}

# Cron expressions for internal jobs (can be overridden)
greedy.mail.cumpleanios.cron=${GREEDY_MAIL_CUMPLEANIOS_CRON:0/30 * * * * ?}
greedy.mail.promociones.cron=${GREEDY_MAIL_PROMOCIONES_CRON:0/30 * * * * ?}

# Logging levels (override per environment)
logging.level.com.example.greedy_gym.servicios.NotificadorCumpleaniosServicio=${LOG_LEVEL_NOTIFICADOR:INFO}
logging.level.org.springframework.mail=${LOG_LEVEL_SPRING_MAIL:DEBUG}

