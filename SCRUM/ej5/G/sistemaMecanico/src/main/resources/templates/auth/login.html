<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Mecánico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🔧 Sistema Mecánico</h2>

    <div th:if="${param.error}" class="alert alert-error">
        Usuario o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Has cerrado sesión correctamente
    </div>

    <div th:if="${param.registro}" class="alert alert-success">
        Registro exitoso. Ya puedes iniciar sesión
    </div>

    <!-- ✨ IMPORTANTE: Usar th:action para que Thymeleaf agregue el token CSRF -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="nombreUsuario">Usuario</label>
            <!-- ✨ CRÍTICO: El name debe ser "nombreUsuario" -->
            <input type="text"
                   id="nombreUsuario"
                   name="nombreUsuario"
                   required
                   autofocus
                   placeholder="Ingresa tu usuario">
        </div>

        <div class="form-group">
            <label for="clave">Contraseña</label>
            <!-- ✨ CRÍTICO: El name debe ser "clave" -->
            <input type="password"
                   id="clave"
                   name="clave"
                   required
                   placeholder="Ingresa tu contraseña">
        </div>

        <button type="submit">Iniciar Sesión</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
    </div>
</div>
</body>
</html>
