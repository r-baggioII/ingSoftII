<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titleEdit}">Gestión de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid m-5 contenedor">

    <h2 class="mb-4" th:text="${titleEdit}">Gestión de Cliente</h2>

    <form class="formulario" th:action="@{/cliente/actualizar}" method="POST" th:object="${item}">

        <!-- Campo oculto para el ID -->
        <input type="hidden" th:field="*{id}">

        <!-- Nombre -->
        <div class="form-group my-3">
            <label class="mb-2">Nombre</label>
            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el nombre del cliente"
                   required>
        </div>

        <!-- Apellido -->
        <div class="form-group my-3">
            <label class="mb-2">Apellido</label>
            <input type="text"
                   class="form-control"
                   th:field="*{apellido}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el apellido del cliente"
                   required>
        </div>

        <!-- Documento -->
        <div class="form-group my-3">
            <label class="mb-2">Documento</label>
            <input type="text"
                   class="form-control"
                   th:field="*{documento}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el documento del cliente"
                   required>
        </div>

        <!-- Botones -->
        <div class="mt-4" th:if="${!isDisabled}">
            <button type="submit" class="btn btn-primary botones">
                <span th:if="${item.id == null}">Guardar</span>
                <span th:if="${item.id != null}">Actualizar</span>
            </button>
            <a th:href="@{/cliente/cancelar}" class="btn btn-secondary botones ms-2">Cancelar</a>
        </div>

        <div class="mt-4" th:if="${isDisabled}">
            <a th:href="@{/cliente/list}" class="btn btn-secondary botones">Volver</a>
        </div>

    </form>

    <!-- Lista de vehículos del cliente (solo en modo consulta) -->
    <div th:if="${isDisabled && item.vehiculos != null && !#lists.isEmpty(item.vehiculos)}" class="mt-5">
        <h4 class="mb-3">Vehículos del Cliente</h4>
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th scope="col">Patente</th>
                <th scope="col">Marca</th>
                <th scope="col">Modelo</th>
                <th scope="col" class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vehiculo : ${item.vehiculos}">
                <td th:text="${vehiculo.patente}"></td>
                <td th:text="${vehiculo.marca}"></td>
                <td th:text="${vehiculo.modelo}"></td>
                <td class="text-center">
                    <a th:href="@{/vehiculo/consultar/{id}(id=${vehiculo.id})}"
                       class="btn btn-info btn-sm"
                       title="Ver detalles del vehículo">
                        <i class="fas fa-eye"></i> Ver
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${isDisabled && (item.vehiculos == null || #lists.isEmpty(item.vehiculos))}" class="alert alert-info mt-5">
        <i class="fas fa-info-circle"></i> Este cliente no tiene vehículos registrados.
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${msgExito != null}" class="alert alert-success mt-3" role="alert">
        <h5 class="alert-heading">¡Éxito! 👍</h5>
        <p th:text="${msgExito}"></p>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${msgError != null}" class="alert alert-danger mt-3" role="alert">
        <h5 class="alert-heading">Error 👎</h5>
        <p th:text="${msgError}"></p>
    </div>

</div>

<footer class="text-muted py-5">
    <div class="container">
        <p class="mb-1">Sistema Mecánico &copy; 2025</p>
        <p class="float-end mb-1">
            <a href="#" style="text-decoration:none"><span>⬆️</span> Volver arriba</a>
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
