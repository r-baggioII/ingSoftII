<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titleEdit}">Gestión de Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid m-5 contenedor">

    <h2 class="mb-4" th:text="${titleEdit}">Gestión de Mecánico</h2>

    <form class="formulario" th:action="@{/mecanico/actualizar}" method="POST" th:object="${item}">

        <!-- Campo oculto para el ID -->
        <input type="hidden" th:field="*{id}">

        <!-- Nombre -->
        <div class="form-group my-3">
            <label class="mb-2">Nombre</label>
            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el nombre del mecánico"
                   required>
        </div>

        <!-- Apellido -->
        <div class="form-group my-3">
            <label class="mb-2">Apellido</label>
            <input type="text"
                   class="form-control"
                   th:field="*{apellido}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el apellido del mecánico"
                   required>
        </div>

        <!-- Legajo -->
        <div class="form-group my-3">
            <label class="mb-2">Legajo</label>
            <input type="text"
                   class="form-control"
                   th:field="*{legajo}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el legajo del mecánico"
                   required>
        </div>

        <!-- Botones -->
        <div class="mt-4" th:if="${!isDisabled}">
            <button type="submit" class="btn btn-primary botones">
                <span th:if="${item.id == null}">Guardar</span>
                <span th:if="${item.id != null}">Actualizar</span>
            </button>
            <a th:href="@{/mecanico/cancelar}" class="btn btn-secondary botones ms-2">Cancelar</a>
        </div>

        <div class="mt-4" th:if="${isDisabled}">
            <a th:href="@{/mecanico/list}" class="btn btn-secondary botones">Volver</a>
        </div>

    </form>

    <!-- Mensaje de éxito -->
    <div th:if="${msgExito != null}" class="alert alert-success mt-3" role="alert">
        <h5 class="alert-heading">¡Éxito! 👍</h5>
        <p th:text="${msgExito}"></p>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${msgError != null}" class="alert alert-danger mt-3" role="alert">
        <h5 class="alert-heading">Error 👎</h5>
        <p th:text="${msgError}"></p>
    </div>

</div>

<footer class="text-muted py-5">
    <div class="container">
        <p class="mb-1">Sistema Mecánico &copy; 2025</p>
        <p class="float-end mb-1">
            <a href="#" style="text-decoration:none"><span>⬆️</span> Volver arriba</a>
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
