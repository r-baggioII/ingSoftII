spring.application.name=mecanico
spring.main.allow-bean-definition-overriding=true

# Configuración de la base de datos MySQL/MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/mecanico_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=adminAdmin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración del servidor
server.port=9000

# Configuración de Thymeleaf
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuración JPA adicional
spring.jpa.open-in-view=false

# Debug de Spring Security para ver flujo de autenticación en consola
logging.level.org.springframework.security=DEBUG
logging.level.com.is.biblioteca=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Incluir mensajes de error en respuestas (útil para 4xx/5xx)
server.error.include-message=always
server.error.include-stacktrace=always