<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titleEdit}">Formulario Historial Arreglo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Sistema Mecánico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/persona/list}">Personas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/cliente/list}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/mecanico/list}">Mecánicos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuario/list}">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/vehiculo/list}">Vehículos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/historialarreglo/list}">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${titleEdit}">Formulario Historial Arreglo</h2>
        
        <div th:if="${msgError}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${msgError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/{entity}/actualizar(entity=${nameEntityLower})}" 
              th:object="${item}" method="post" class="needs-validation">
            
            <input type="hidden" th:field="*{id}" />
            
            <div class="mb-3">
                <label for="fechaArreglo" class="form-label">Fecha del Arreglo:</label>
                <input type="date" class="form-control" id="fechaArreglo" th:field="*{fechaArreglo}" 
                       th:disabled="${isDisabled}" required />
            </div>
            
            <div class="mb-3">
                <label for="vehiculo" class="form-label">Vehículo:</label>
                <select class="form-control" id="vehiculo" th:field="*{vehiculo}" 
                        th:disabled="${isDisabled}" required>
                    <option value="">Seleccione un vehículo</option>
                    <option th:each="v : ${vehiculos}" 
                            th:value="${v.id}" 
                            th:text="${v.patente + ' - ' + v.marca + ' ' + v.modelo}"></option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="mecanico" class="form-label">Mecánico:</label>
                <select class="form-control" id="mecanico" th:field="*{mecanico}" 
                        th:disabled="${isDisabled}" required>
                    <option value="">Seleccione un mecánico</option>
                    <option th:each="m : ${mecanicos}" 
                            th:value="${m.id}" 
                            th:text="${m.nombre + ' ' + m.apellido + ' (Legajo: ' + m.legajo + ')'}"></option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="detalleArreglo" class="form-label">Detalle del Arreglo:</label>
                <textarea class="form-control" id="detalleArreglo" th:field="*{detalleArreglo}" 
                          rows="5" th:disabled="${isDisabled}" required></textarea>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary" th:unless="${isDisabled}">Guardar</button>
                <a th:href="@{/{entity}/cancelar(entity=${nameEntityLower})}" class="btn btn-secondary">
                    <span th:if="${isDisabled}">Volver</span>
                    <span th:unless="${isDisabled}">Cancelar</span>
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
