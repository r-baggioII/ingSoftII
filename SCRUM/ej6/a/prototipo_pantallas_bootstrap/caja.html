<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caja - Prototipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <a href="index.html" class="btn btn-link">&larr; Volver</a>
      <h2>Caja</h2>
      <form class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Nombre de la caja">
        </div>
        <div class="col-md-6">
          <label class="form-label">Sucursal</label>
          <select class="form-select">
            <option>Sucursal Centro</option>
            <option>Sucursal Norte</option>
            <option>Sucursal Sur</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn btn-primary">Guardar Caja</button>
        </div>
      </form>

      <hr>
      <h5>Listado de cajas (ejemplo)</h5>
      <table class="table table-sm">
        <thead><tr><th>Nombre</th><th>Sucursal</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr>
            <td>Caja 001</td>
            <td>Sucursal Centro</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
          <tr>
            <td>Caja 002</td>
            <td>Sucursal Norte</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
