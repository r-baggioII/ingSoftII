<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente - Prototipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <a href="index.html" class="btn btn-link">&larr; Volver</a>
      <h2>Cliente</h2>
      <form class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Nombre completo">
        </div>
        <div class="col-md-6">
          <label class="form-label">Documento</label>
          <input type="text" class="form-control" placeholder="DNI / CUIT">
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" placeholder="+54 9...">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="cliente@ejemplo.com">
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Guardar Cliente</button>
        </div>
      </form>

      <hr>
      <h5>Listado de clientes (ejemplo)</h5>
      <table class="table table-sm">
        <thead><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Email</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr>
            <td>Juan Pérez</td>
            <td>12345678</td>
            <td>+54 9 11 1234-5678</td>
            <td>juan@example.com</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
          <tr>
            <td>María López</td>
            <td>23456789</td>
            <td>+54 9 11 2345-6789</td>
            <td>maria@example.com</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
