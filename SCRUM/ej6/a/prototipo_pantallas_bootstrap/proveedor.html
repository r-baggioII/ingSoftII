<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedor - Prototipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <a href="index.html" class="btn btn-link">&larr; Volver</a>
      <h2>Proveedor</h2>
      <form class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Nombre de contacto">
        </div>
        <div class="col-md-6">
          <label class="form-label">Razón Social</label>
          <input type="text" class="form-control" placeholder="Razón social">
        </div>
        <div class="col-md-6">
          <label class="form-label">Mail</label>
          <input type="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-control" placeholder="+54 9...">
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Guardar Proveedor</button>
        </div>
      </form>

      <hr>
      <h5>Listado de proveedores (ejemplo)</h5>
      <table class="table table-sm">
        <thead><tr><th>Nombre / Razón Social</th><th>Mail</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr>
            <td>La Huerta S.A.</td>
            <td>la.huerta@example.com</td>
            <td>+54 9 11 3322-1100</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
          <tr>
            <td>Carnes del Sur SRL</td>
            <td>ventas@carnesdelsur.com</td>
            <td>+54 9 11 4433-2200</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
