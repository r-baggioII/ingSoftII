<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sucursal - Prototipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <a href="index.html" class="btn btn-link">&larr; Volver</a>
      <h2>Sucursal</h2>
      <form class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Nombre de la sucursal">
        </div>

        <!-- Domicilio separado en campos (mostrar todos los campos relevantes para Sucursal) -->
        <div class="col-md-6">
          <label class="form-label">Calle</label>
          <input type="text" class="form-control" placeholder="Calle">
        </div>
        <div class="col-md-3">
          <label class="form-label">Número</label>
          <input type="text" class="form-control" placeholder="Número">
        </div>
        <div class="col-md-3">
          <label class="form-label">Código Postal</label>
          <input type="text" class="form-control" placeholder="CP">
        </div>
        <div class="col-md-6">
          <label class="form-label">Ciudad</label>
          <input type="text" class="form-control" placeholder="Ciudad">
        </div>
        <div class="col-md-6">
          <label class="form-label">Provincia</label>
          <input type="text" class="form-control" placeholder="Provincia">
        </div>

        <div class="col-12">
          <button class="btn btn-primary">Guardar Sucursal</button>
        </div>
      </form>

      <hr>
      <h5>Listado de sucursales (ejemplo)</h5>
      <table class="table table-sm">
        <thead><tr><th>Nombre</th><th>Ciudad</th><th>Provincia</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr>
            <td>Sucursal Centro</td>
            <td>Ciudad X</td>
            <td>Provincia Y</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
          <tr>
            <td>Sucursal Norte</td>
            <td>Ciudad Z</td>
            <td>Provincia Y</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
