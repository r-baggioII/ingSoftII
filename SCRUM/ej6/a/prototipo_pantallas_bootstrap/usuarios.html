<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - Prototipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <a href="index.html" class="btn btn-link">&larr; Volver</a>
      <h2>Usuarios y Roles</h2>

      <form class="row g-3 mt-2">
        <div class="col-md-4">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" placeholder="Nombre completo">
        </div>
        <div class="col-md-4">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="usuario@ejemplo.com">
        </div>
        <div class="col-md-4">
          <label class="form-label">Documento (DNI / CUIT)</label>
          <input type="text" class="form-control" placeholder="Documento">
        </div>
        <div class="col-md-4">
          <label class="form-label">Tipo de persona</label>
          <select class="form-select">
            <option>Empleado</option>
            <option>Cliente</option>
            <option>Proveedor</option>
            <option>Dueño</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Teléfono / Contacto</label>
          <input type="tel" class="form-control" placeholder="+54 9...">
        </div>
        <div class="col-md-4">
          <label class="form-label">Rol</label>
          <select class="form-select">
            <option>Admin</option>
            <option>Vendedor</option>
            <option>Cajero</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Sucursales asignadas</label>
          <select class="form-select" multiple>
            <option>Sucursal Centro</option>
            <option>Sucursal Norte</option>
            <option>Sucursal Sur</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Cajas asignadas (si aplica)</label>
          <select class="form-select" multiple>
            <option>Caja 001 - Centro</option>
            <option>Caja 002 - Norte</option>
          </select>
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Guardar Usuario</button>
        </div>
      </form>

      <hr>
      <h5>Listado de usuarios (ejemplo)</h5>
      <table class="table table-sm">
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Sucursales</th><th>Cajas</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr>
            <td>Ana García</td>
            <td>ana@example.com</td>
            <td>Cajero</td>
            <td>Sucursal Centro</td>
            <td>Caja 001</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="#">Editar</a>
              <button class="btn btn-sm btn-outline-danger ms-1">Desactivar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
