<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 contenedor">
    <h2 class="mb-4 text-center" th:text="${titleEdit}">Gestión de Empresa</h2>

    <!-- Formulario de alta -->
    <form class="formulario" th:action="@{/empresa/actualizar}" method="POST" th:object="${item}">

        <!-- ID oculto (para modificaciones) -->
        <input type="hidden" th:field="*{id}">

        <!-- Nombre -->
        <div class="form-group my-3">
            <label for="nombre" class="mb-2">Nombre</label>
            <input type="text"
                   id="nombre"
                   class="form-control"
                   th:field="*{nombre}"
                   th:disabled="${isDisabled}"
                   placeholder="Ingrese el nombre de la empresa"
                   required>
        </div>

        <!-- Contacto -->
        <div class="form-group my-3">
            <label for="contactoId" class="mb-2">Contacto Asociado</label>
            <select id="contactoId"
                    class="form-select"
                    name="contactoId"
                    th:disabled="${isDisabled}">
                <option value="">Sin contacto asignado</option>
                <optgroup label="Correos Electrónicos">
                    <option th:each="contacto : ${contactosDisponibles}"
                            th:if="${contacto.getClass().simpleName == 'ContactoCorreoElectronico'}"
                            th:value="${contacto.id}"
                            th:selected="${item.contacto != null && item.contacto.id == contacto.id}"
                            th:text="${'📧 ' + contacto.mail + ' (' + contacto.tipoContacto + ')'}">
                    </option>
                </optgroup>
                <optgroup label="Teléfonos">
                    <option th:each="contacto : ${contactosDisponibles}"
                            th:if="${contacto.getClass().simpleName == 'ContactoTelefonico'}"
                            th:value="${contacto.id}"
                            th:selected="${item.contacto != null && item.contacto.id == contacto.id}"
                            th:text="${'📱 ' + contacto.telefono + ' (' + contacto.tipoTelefono + ')'}">
                    </option>
                </optgroup>
            </select>
            <small class="form-text text-muted">Seleccione el contacto principal de la empresa</small>
        </div>

        <!-- Botones -->
        <div class="mt-4 text-center">
            <button type="submit" class="btn btn-primary px-4" th:if="${!isDisabled}">Guardar</button>
            <a th:href="@{/empresa/list}" class="btn btn-secondary ms-2 px-4">
                <span th:text="${isDisabled ? 'Volver' : 'Cancelar'}">Cancelar</span>
            </a>
        </div>

    </form>

    <!-- Mensajes de éxito o error -->
    <div th:if="${msgExito != null}" class="alert alert-success mt-4" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${msgExito}"></span>
    </div>

    <div th:if="${msgError != null}" class="alert alert-danger mt-4" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${msgError}"></span>
    </div>
</div>

<footer class="text-muted py-5">
    <div class="container text-center">
        <p class="mb-1">Gestión de Empresas y Contactos &copy; 2025</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
