<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titleList}">Listado de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container m-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${titleList}">Listado de Personas</h2>
        <a th:href="@{/persona/alta}" class="btn btn-success">
            <i class="fas fa-plus"></i> Nuevo
        </a>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${msgExito != null}" class="alert alert-success" role="alert">
        <h5 class="alert-heading">¡Éxito! 👍</h5>
        <p th:text="${msgExito}"></p>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${msgError != null}" class="alert alert-danger" role="alert">
        <h5 class="alert-heading">Error 👎</h5>
        <p th:text="${msgError}"></p>
    </div>

    <!-- Tabla de personas -->
    <table class="table table-dark table-striped table-hover">
        <thead>
        <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Apellido</th>
            <th scope="col" class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.nombre}">Nombre</td>
            <td th:text="${item.apellido}">Apellido</td>
            <td class="text-center">
                <a th:href="@{/persona/consultar/{id}(id=${item.id})}"
                   class="btn btn-info btn-sm me-1"
                   title="Ver">
                    <i class="fas fa-eye"></i>
                </a>
                <a th:href="@{/persona/modificar/{id}(id=${item.id})}"
                   class="btn btn-warning btn-sm me-1"
                   title="Editar">
                    <i class="fas fa-edit"></i>
                </a>
                <a th:href="@{/persona/baja/{id}(id=${item.id})}"
                   class="btn btn-danger btn-sm"
                   title="Eliminar"
                   onclick="return confirm('¿Está seguro de eliminar esta persona?')">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="3" class="text-center">No hay personas registradas</td>
        </tr>
        </tbody>
    </table>

    <section class="text-center mt-4">
        <a th:href="@{/inicio}" class="btn btn-secondary">Volver al Inicio</a>
    </section>

</div>

<footer class="text-muted py-5">
    <div class="container">
        <p class="mb-1">Sistema Mecánico &copy; 2025</p>
        <p class="float-end mb-1">
            <a href="#" style="text-decoration:none"><span>⬆️</span> Volver arriba</a>
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
