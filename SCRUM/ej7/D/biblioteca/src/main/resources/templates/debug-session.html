<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Debug Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug - Información de Sesión</h1>
        
        <div class="card mt-3">
            <div class="card-header bg-primary text-white">
                <h3>Usuario en Sesión</h3>
            </div>
            <div class="card-body">
                <p><strong>Existe usuariosession:</strong> <span th:text="${session.usuariosession != null}">false</span></p>
                
                <div th:if="${session.usuariosession != null}">
                    <p><strong>ID:</strong> <span th:text="${session.usuariosession.id}">N/A</span></p>
                    <p><strong>Nombre:</strong> <span th:text="${session.usuariosession.nombre}">N/A</span></p>
                    <p><strong>Email:</strong> <span th:text="${session.usuariosession.email}">N/A</span></p>
                    <p><strong>Rol:</strong> <span th:text="${session.usuariosession.rol}">N/A</span></p>
                    <p><strong>Rol toString:</strong> <span th:text="${session.usuariosession.rol.toString()}">N/A</span></p>
                    <p><strong>Es ADMIN:</strong> <span th:text="${session.usuariosession.rol.toString() == 'ADMIN'}">false</span></p>
                    <p><strong>Es USER:</strong> <span th:text="${session.usuariosession.rol.toString() == 'USER'}">false</span></p>
                </div>
                
                <div th:if="${session.usuariosession == null}">
                    <p class="text-danger">No hay usuario en sesión</p>
                </div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-header bg-info text-white">
                <h3>Información Auth0</h3>
            </div>
            <div class="card-body">
                <p><strong>Es usuario Auth0:</strong> <span th:text="${session.auth0User}">false</span></p>
            </div>
        </div>
        
        <div class="mt-3">
            <a href="/usuario/inicio" class="btn btn-primary">Volver a Inicio</a>
        </div>
    </div>
</body>
</html>
