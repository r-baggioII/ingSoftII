<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<title>Biblioteca - Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
	<link rel="stylesheet" href="/css/formulario.css">
</head>

<body>

	<nav class="navbar navbar-expand-lg navBar">
		<div class="containerImg">
			<a href="#" class="navbar-brand d-flex align-items-center">
				<img class="logo" src="/img/Egg.png" alt="Img logo egg">
			</a>
		</div>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
			aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse elementosNav" id="navbarNavDropdown">
			<ul class="navbar-nav ms-auto elementos">
				<li class="nav-item">
					<a class="nav-link " href="/usuario/registrar" id="navbarDropdown" role="button" aria-expanded="false">
						Registrate!
					</a>

				</li>

			</ul>
		</div>
	</nav>



	<div class="container-fluid m-5 contenedor">
		
		<div th:if="${error != null}" class="card text-white bg-danger mb-3 mensajeError">
			<div class="card-body">
				<h5 class="card-title">Error!</h5>
				<p class="card-text" th:text="${error}"></p>
			</div>
		</div>
		
		<div th:if="${exito != null}" class="card text-white bg-success mb-3 mt-3 mensajeExito">
			<div class="card-body">
				<h5 class="card-title">Exito!</h5>
				<p class="card-text" th:text="${exito}"></p>
			</div>
		</div>

		<!-- <form class="formulario" th:action="@{/usuario/inicio}" method="POST">-->

		<form class="formulario" th:action="@{/logincheck}" method="POST">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			
			<div class="form-group my-3">
				<h3 class="card-title">Accede a la Biblioteca!</h3>
			</div>

			<div class="form-group my-3">
				<input type="email" class="form-control" name="email" placeholder="EMAIL">
			</div>

			<div class="form-group my-3">
				<input type="password" class="form-control" name="password" placeholder="CONTRASEÑA">
			</div>


			<button type="submit" class="btn btn-primary mt-3 botones">Ingresar!</button>
            
		</form>

		<!-- Separador -->
		<div class="text-center my-4">
			<p class="text-muted">──────── O ────────</p>
		</div>

		<!-- Botón para iniciar sesión con Auth0/Google -->
		<div class="text-center">
			<a href="/oauth2/authorization/auth0" class="btn btn-outline-primary botones" 
			   style="display: flex; align-items: center; justify-content: center; gap: 10px;">
				<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
					<path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"/>
				</svg>
				Continuar con Google / Redes Sociales
			</a>
		</div>


		<section class=" text-center container">
			<div class="row mt-3">
				<div class="divVolver">
					<a th:href="@{/}" class="btn btn-secondary my-2 botonVolver botones">Volver</a>
				</div>
			</div>
		</section>

	</div>

	<footer class="text-muted py-5">
		<div class="containerFooter">
			<p class="mb-1">Album example is &copy; Bootstrap,<br>but please download and customize it for yourself!</p>
			<p class="mb-0">New to Bootstrap? <a href="/"><br>Visit the homepage</a> or read our <a
					href="../getting-started/introduction/">getting started guide</a>.</p>
			<p class="float-end mb-1">
				<a href="#" style="text-decoration:none"><span>â¬ï¸</span> Back to top</a>
			</p>
		</div>
	</footer>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
		crossorigin="anonymous"></script>
</body>

</html>
