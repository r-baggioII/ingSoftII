<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pais.id} != null ? 'Editar País' : 'Crear País'">Formulario País</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<section>
    <h1 th:text="${pais.id} != null ? 'Editar País' : 'Crear País'">Formulario País</h1>

    <article th:if="${error}" class="alert alert-danger" th:text="${error}"></article>

    <form th:object="${pais}"
          th:action="${pais.id} != null ? @{/paises/{id}(id=${pais.id})} : @{/paises}"
          method="post">
        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" placeholder="Ingrese el país"/>
        </div>

        <div>
            <button type="submit" th:text="${pais.id} != null ? 'Actualizar' : 'Guardar'">Guardar</button>
            <a th:href="@{/paises}">Volver</a>
        </div>
    </form>
</section>
</body>
</html>
