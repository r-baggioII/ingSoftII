# ============================================
# GREEDY CARS WEB - Frontend Client
# ============================================
spring.application.name=greedy_cars_web

# Puerto diferente al backend (que usa 9000)
server.port=8081

# ============================================
# API REST Backend Configuration
# ============================================
# URL base de la API backend
api.base.url=http://localhost:9000
# Timeout para conexiones REST (en milisegundos)
api.connection.timeout=5000
api.read.timeout=5000

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.uncuyo.greedy_cars_web=DEBUG
logging.level.org.springframework.web=DEBUG

# Mostrar mensajes de error completos
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always
