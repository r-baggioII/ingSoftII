# Configuración alternativa en YAML (opcional, usa properties o yml, no ambos)
spring:
  application:
    name: greedy_cars_web
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always

# API Backend Configuration
api:
  base:
    url: http://localhost:9000
  connection:
    timeout: 5000
  read:
    timeout: 5000

logging:
  level:
    root: INFO
    com.uncuyo.greedy_cars_web: DEBUG
    org.springframework.web: DEBUG
