version: '3.8'

services:
  # Base de datos MariaDB para greedy_cars
  greedy_cars_db:
    image: mariadb:10.6
    container_name: greedy_cars_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - greedy_cars_db_data:/var/lib/mysql
    networks:
      - greedy_network

  # API principal de greedy_cars
  greedy_cars:
    build:
      context: ./greedy_cars
      dockerfile: Dockerfile
    image: greedy_cars:latest
    container_name: greedy_cars_api
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SPRING_APPLICATION_NAME: greedy_cars
      SPRING_DATASOURCE_URL: jdbc:mariadb://greedy_cars_db:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Argentina/Mendoza
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION_MS: 3600000
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
      GREEDY_MAIL_DEFAULT_FROM: ${GREEDY_MAIL_DEFAULT_FROM}
      SERVER_SERVLET_CONTEXT_PATH: /greedy_cars
    depends_on:
      - greedy_cars_db
    networks:
      - greedy_network
    volumes:
      - ./greedy_cars/target:/app/target:ro

  # Sitio institucional
  greedy_institucional:
    build:
      context: ./greedy_institucional
      dockerfile: Dockerfile
    image: greedy_institucional:latest
    container_name: greedy_institucional_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: institucional
      GREEDY_API_BASE_URL: http://greedy_cars:9000/greedy_cars/api
      GREEDY_API_USERNAME: ${GREEDY_API_USERNAME}
      GREEDY_API_PASSWORD: ${GREEDY_API_PASSWORD}
      SERVER_SERVLET_CONTEXT_PATH: /greedy_institucional
    depends_on:
      - greedy_cars
    networks:
      - greedy_network
    volumes:
      - ./greedy_institucional/target:/app/target:ro

  # Aplicación cliente
  gredy_cars_client:
    build:
      context: ./gredy_cars_client/gredy_cars_client
      dockerfile: Dockerfile
    image: gredy_cars_client:latest
    container_name: gredy_cars_client_app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_APPLICATION_NAME: gredy_cars_client
      GREEDY_API_BASE_URL: http://greedy_cars:9000/greedy_cars/api
      GREEDY_API_USERNAME: ${GREEDY_API_USERNAME}
      GREEDY_API_PASSWORD: ${GREEDY_API_PASSWORD}
      SERVER_SERVLET_CONTEXT_PATH: /gredy_cars_client
    depends_on:
      - greedy_cars
    networks:
      - greedy_network
    volumes:
      - ./gredy_cars_client/gredy_cars_client/target:/app/target:ro

# Volumes para persistencia de datos
volumes:
  greedy_cars_db_data:
    driver: local

# Red personalizada para comunicación entre contenedores
networks:
  greedy_network:
    driver: bridge