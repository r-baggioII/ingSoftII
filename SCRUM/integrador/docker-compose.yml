version: '3.8'

services:
  # Base de datos MariaDB para greedy_cars
  greedy_cars_db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-adminAdmin}
      - MARIADB_DATABASE=${MYSQL_DATABASE:-greedy_cars_db}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # API principal de greedy_cars
  greedy_cars:
    build:
      context: ./greedy_cars
    image: greedy_cars:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SPRING_APPLICATION_NAME=greedy_cars
      - SPRING_DATASOURCE_URL=jdbc:mariadb://greedy_cars_db:3306/${MYSQL_DATABASE:-greedy_cars_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-adminAdmin}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_JWT_SECRET=${JWT_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=9000
    depends_on:
      - greedy_cars_db

  # Sitio institucional
  greedy_institucional:
    build:
      context: ./greedy_institucional
    image: greedy_institucional:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=greedy_institucional
      - GREEDY_API_BASE_URL=http://greedy_cars:9000/greedy_cars/api
      - GREEDY_API_USERNAME=${GREEDY_API_USERNAME:-admin}
      - GREEDY_API_PASSWORD=${GREEDY_API_PASSWORD:-GreedyAdmin123!}
    depends_on:
      - greedy_cars

  # Aplicación cliente
  gredy_cars_client:
    build:
      context: ./gredy_cars_client/gredy_cars_client
    image: gredy_cars_client:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_APPLICATION_NAME=gredy_cars_client
      - GREEDY_API_BASE_URL=http://greedy_cars:9000/greedy_cars/api
      - GREEDY_API_USERNAME=${GREEDY_API_USERNAME:-admin}
      - GREEDY_API_PASSWORD=${GREEDY_API_PASSWORD:-GreedyAdmin123!}
    depends_on:
      - greedy_cars

volumes:
  db_data:
    driver: local