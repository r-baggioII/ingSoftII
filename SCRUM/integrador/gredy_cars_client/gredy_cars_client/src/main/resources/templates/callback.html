<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando autenticación...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous" />
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <div class="spinner-border text-primary mb-4" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Procesando...</span>
                        </div>
                        <h3 class="mb-3">Procesando autenticación</h3>
                        <p class="text-muted">Por favor espere mientras verificamos sus credenciales.</p>
                        <div id="error-message" class="alert alert-danger mt-4" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // El servidor (Auth0CallbackController) manejará toda la autenticación
        // Este HTML solo se muestra mientras el backend:
        // 1. Recibe el 'code' de Auth0
        // 2. Lo intercambia por un access_token
        // 3. Obtiene la información del usuario
        // 4. Verifica si el usuario existe en la BD
        // 5. Redirige a /dashboard o /registro-intermedio
        
        // Verificar si hay un error en la URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');
        
        if (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = '<strong>Error de autenticación:</strong><br>' + 
                                 (errorDescription || error);
            document.querySelector('.spinner-border').style.display = 'none';
            document.querySelector('h3').textContent = 'Error';
            document.querySelector('.text-muted').textContent = 'No se pudo completar la autenticación.';
        }
    </script>
</body>
</html>
