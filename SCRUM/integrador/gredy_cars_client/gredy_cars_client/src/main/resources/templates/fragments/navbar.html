<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-light container-fluid py-3 position-fixed">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}"><img th:src="@{/images/logo.png}" alt="logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav align-items-center justify-content-end flex-grow-1 pe-3">
              <li class="nav-item"><a class="nav-link px-3" th:href="@{/}">Home</a></li>
              <li class="nav-item"><a class="nav-link px-3" th:href="@{/gestion/vehiculos}">Gestión Vehículos</a></li>
              <li class="nav-item"><a class="nav-link px-3" th:href="@{/empresas}">Empresas</a></li>
              <li class="nav-item"><a class="btn btn-outline-primary px-3" th:href="@{/login}">Cerrar Sesión</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </div>
</body>
</html>
