<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Países</title>
    <link rel="stylesheet" th:href="@{/css/vendor.css}">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<section>
    <h1>Gestión de Países</h1>

    <article th:if="${success}" class="alert alert-success" th:text="${success}"></article>
    <article th:if="${error}" class="alert alert-danger" th:text="${error}"></article>

    <p>
        <a th:href="@{/paises/nuevo}">Crear nuevo país</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pais : ${paises}">
            <td th:text="${pais.id}">1</td>
            <td th:text="${pais.nombre}">Argentina</td>
            <td>
                <a th:href="@{/paises/{id}/editar(id=${pais.id})}">Editar</a>
                <form th:action="@{/paises/{id}/eliminar(id=${pais.id})}" method="post" style="display:inline">
                    <button type="submit" onclick="return confirm('¿Eliminar país?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(paises)}">
        <p>No hay países registrados.</p>
    </div>
</section>
</body>
</html>
