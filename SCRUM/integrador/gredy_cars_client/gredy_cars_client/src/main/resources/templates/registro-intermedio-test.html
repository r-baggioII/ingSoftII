<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Test - Completar Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Completar Registro - Test</h1>
    <p>Email: <span th:text="${email}">test@example.com</span></p>
    <p>External ID: <span th:text="${externalId}">google-oauth2|123</span></p>
    
    <form method="post" th:action="@{/auth0/api/registro-intermedio}">
      <div class="mb-3">
        <label>Nombre:</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Apellido:</label>
        <input type="text" name="apellido" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
  </div>
</body>
</html>
