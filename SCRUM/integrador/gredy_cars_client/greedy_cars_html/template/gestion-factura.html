<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Facturas - Greedy Cars</title>

  <link rel="stylesheet" type="text/css" href="css/vendor.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="js/modernizr.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light container-fluid py-3 position-fixed">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="logo" /></a>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container">
      <h2 class="mb-4">Gestión de Facturas</h2>

      <div class="card mb-4">
        <div class="card-body">
          <h5>Crear / Editar Factura</h5>
          <form id="factura-form">
            <div class="row g-3">
              <div class="col-md-3">
                <label>Numero Factura</label>
                <input id="facturaNumero" type="number" class="form-control">
              </div>
              <div class="col-md-3">
                <label>Fecha Factura</label>
                <input id="facturaFecha" type="date" class="form-control">
              </div>
              <div class="col-md-3">
                <label>Total Pagado</label>
                <input id="facturaTotal" type="number" step="0.01" class="form-control">
              </div>
              <div class="col-md-3">
                <label>Estado</label>
                <select id="facturaEstado" class="form-select">
                  <option value="SIN_DEFINIR">SIN_DEFINIR</option>
                  <option value="PAGADA">PAGADA</option>
                  <option value="ANULADA">ANULADA</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label>ID Alquiler (asociado)</label>
                <input id="facturaAlquilerId" type="text" class="form-control" placeholder="ID del alquiler">
              </div>
              <div class="col-md-6">
                <label>Forma de Pago - Tipo</label>
                <select id="facturaFormaTipo" class="form-select">
                  <option value="EFECTIVO">EFECTIVO</option>
                  <option value="TRANSFEENCIA">TRANSFEENCIA</option>
                  <option value="BILLETERA_VIRTUAL">BILLETERA_VIRTUAL</option>
                </select>
              </div>
            </div>

            <input type="hidden" id="facturaId" value="">
            <div class="mt-3 d-flex gap-2">
              <button class="btn main-button-panel" type="submit">Guardar Factura</button>
              <button class="btn btn-outline-secondary" id="factura-reset" type="button">Limpiar</button>
              <a href="gestion-alquiler.html" class="btn btn-outline-primary">Volver a Alquileres</a>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5>Facturas</h5>
          <div class="mb-3 row">
            <div class="col-md-8"><input id="factura-search" class="form-control" placeholder="Buscar por numero, alquiler o estado"></div>
            <div class="col-md-4"><button id="factura-buscar" class="btn main-button-panel w-100">Buscar</button></div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Numero</th>
                  <th>Fecha</th>
                  <th>Total</th>
                  <th>Estado</th>
                  <th>Forma Pago</th>
                  <th>ID Alquiler</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="factura-table-body">
                <tr>
                  <td>FA-1</td>
                  <td>123456</td>
                  <td>2025-10-12</td>
                  <td>$100.00</td>
                  <td>PAGADA</td>
                  <td>EFECTIVO</td>
                  <td>ALQ-001</td>
                  <td class="text-end"><button class="btn btn-sm btn-outline-primary">Editar</button> <button class="btn btn-sm btn-outline-danger">Eliminar</button></td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </section>

  <script src="js/jquery-1.11.0.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>

  <script>
    (function(){
      function generateId(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

      function DetalleFactura({id, idAlquiler, cantidad, subtotal, eliminado}){
        this.id = id || generateId('DF');
        this.idAlquiler = idAlquiler || null;
        this.cantidad = Number(cantidad) || 1;
        this.subtotal = Number(subtotal) || 0.0;
        this.eliminado = !!eliminado;
      }

      function Factura({id, numeroFactura, fechaFactura, totalPagado, estado, detalles, formaDePago, eliminado}){
        this.id = id || generateId('FA');
        this.numeroFactura = Number(numeroFactura) || 0;
        this.fechaFactura = fechaFactura || null;
        this.totalPagado = Number(totalPagado) || 0.0;
        this.estado = estado || 'SIN_DEFINIR';
        this.detalles = Array.isArray(detalles) ? detalles : [];
        this.formaDePago = formaDePago || null;
        this.eliminado = !!eliminado;
      }

      function FormaDePago({id, tipoPago, observacion, eliminado}){
        this.id = id || generateId('FP');
        this.tipoPago = tipoPago || 'EFECTIVO';
        this.observacion = observacion || '';
        this.eliminado = !!eliminado;
      }

      const detallesStore = [];
      const facturaStore = [];
      const formaStore = [];

      // API
      window.crearFormaDePago = function(tipoPago, observacion){ const f = new FormaDePago({tipoPago, observacion}); formaStore.push(f); return f; };
      window.modificarFormaDePago = function(id, tipoPago, observacion){ const f=formaStore.find(x=>x.id===id); if(!f) throw new Error('No encontrado'); f.tipoPago=tipoPago; f.observacion=observacion; return f; };
      window.eliminarValorCuota = function(id){ const f=formaStore.find(x=>x.id===id); if(f) f.eliminado=true; };

      window.crearDetalleFactura = function(idAlquiler){ const d=new DetalleFactura({idAlquiler,cantidad:1,subtotal:0}); detallesStore.push(d); return d; };
      window.buscarDetalleFactura = function(id){ return detallesStore.find(x=>x.id===id)||null; };
      window.modificarDetalleFactura = function(idDetalle,idAlquiler){ const d=window.buscarDetalleFactura(idDetalle); if(!d) throw new Error('No encontrado'); d.idAlquiler=idAlquiler; return d; };
      window.eliminarDetalleFactura = function(id){ const d=window.buscarDetalleFactura(id); if(d) d.eliminado=true; };

      window.validarFactura = function(numeroFactura, fechaFactura, totalPagado, estado, detallesCollection, formaDePago){
        if(typeof numeroFactura === 'undefined' || isNaN(Number(numeroFactura))) throw new Error('Numero inválido');
        if(!fechaFactura || isNaN(Date.parse(fechaFactura))) throw new Error('Fecha inválida');
        if(typeof totalPagado === 'undefined' || isNaN(Number(totalPagado))) throw new Error('Total inválido');
        if(!Array.isArray(detallesCollection) || detallesCollection.length===0) throw new Error('Debe incluir al menos un detalle');
        if(!formaDePago) throw new Error('Forma de pago requerida');
      };

      window.crearFactura = function(numeroFactura, fechaFactura, totalPagado, estado, detallesCollection, formaDePago){
        window.validarFactura(numeroFactura, fechaFactura, totalPagado, estado, detallesCollection, formaDePago);
        const detalles = detallesCollection.map(d=> typeof d.id!=='undefined'?d:new DetalleFactura(d));
        detalles.forEach(dt=>{ if(!detallesStore.find(x=>x.id===dt.id)) detallesStore.push(dt); });
        const f = new Factura({numeroFactura, fechaFactura, totalPagado, estado, detalles, formaDePago}); facturaStore.push(f); renderFacturaRow(f); return f;
      };

      window.modificarFactura = function(id, numeroFactura, fechaFactura, totalPagado, estado, detallesCollection){ const f=facturaStore.find(x=>x.id===id); if(!f) throw new Error('Factura no encontrada'); window.validarFactura(numeroFactura, fechaFactura, totalPagado, estado, detallesCollection, f.formaDePago); f.numeroFactura=Number(numeroFactura); f.fechaFactura=fechaFactura; f.totalPagado=Number(totalPagado); f.estado=estado; f.detalles=detallesCollection; reRenderFacturaTable(); return f; };
      window.buscarFactura = function(id){ return facturaStore.find(x=>x.id===id)||null; };
      window.eliminarFactura = function(id){ const f=window.buscarFactura(id); if(!f) throw new Error('Factura no encontrada'); f.eliminado=true; reRenderFacturaTable(); };
      window.listarFactura = function(){ return facturaStore.slice(); };
      window.listarFacturaActivo = function(){ return facturaStore.filter(x=>!x.eliminado); };
      window.listarFacturaPorEstado = function(estado){ return facturaStore.filter(x=>x.estado===estado); };

      // UI wiring
      const form = document.getElementById('factura-form');
      const tbody = document.getElementById('factura-table-body');

      if(form && tbody){
        form.addEventListener('submit', function(e){
          e.preventDefault();
          const idHidden = document.getElementById('facturaId').value || '';
          const numero = document.getElementById('facturaNumero').value || Date.now();
          const fecha = document.getElementById('facturaFecha').value || new Date().toISOString().slice(0,10);
          const total = parseFloat(document.getElementById('facturaTotal').value || 0);
          const estado = document.getElementById('facturaEstado').value || 'SIN_DEFINIR';
          const idAlq = document.getElementById('facturaAlquilerId').value || '';
          const tipoFP = document.getElementById('facturaFormaTipo').value || 'EFECTIVO';

          // create a detalle for the alquiler if none provided
          const detalle = window.crearDetalleFactura(idAlq);
          const forma = window.crearFormaDePago(tipoFP, 'Creada desde gestión factura');

          try{
            if(!idHidden) window.crearFactura(numero, fecha, total, estado, [detalle], forma);
            else window.modificarFactura(idHidden, numero, fecha, total, estado, [detalle]);
            form.reset(); document.getElementById('facturaId').value='';
          }catch(err){ alert('Error: '+err.message); }
        });

        document.getElementById('factura-reset').addEventListener('click', function(){ form.reset(); document.getElementById('facturaId').value=''; });
      }

      function renderFacturaRow(f){
        const tr = document.createElement('tr'); tr.dataset.id = f.id;
        tr.innerHTML = '<td>'+escapeHtml(f.id)+'</td>'+
                       '<td>'+escapeHtml(f.numeroFactura)+'</td>'+
                       '<td>'+escapeHtml(f.fechaFactura)+'</td>'+
                       '<td>'+escapeHtml(Number(f.totalPagado).toFixed(2))+'</td>'+
                       '<td>'+escapeHtml(f.estado)+'</td>'+
                       '<td>'+escapeHtml((f.formaDePago && f.formaDePago.tipoPago) || '')+'</td>'+
                       '<td>'+escapeHtml((f.detalles && f.detalles[0] && f.detalles[0].idAlquiler) || '')+'</td>'+
                       '<td class="text-end"><button class="btn btn-sm btn-outline-primary btn-edit" data-id="'+f.id+'">Editar</button> <button class="btn btn-sm btn-outline-danger btn-delete" data-id="'+f.id+'">Eliminar</button></td>';
        tbody.prepend(tr);
      }

      function reRenderFacturaTable(){ tbody.innerHTML = ''; window.listarFactura().forEach(renderFacturaRow); }

      function escapeHtml(s){ return String(s||'').replace(/[&<>'\"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

      document.addEventListener('click', function(e){
        if(e.target.matches('.btn-delete')){ const id=e.target.dataset.id; try{ window.eliminarFactura(id);}catch(err){console.warn(err);} }
        if(e.target.matches('.btn-edit')){ const id=e.target.dataset.id; const f=window.buscarFactura(id); if(!f) return; document.getElementById('facturaId').value=f.id; document.getElementById('facturaNumero').value=f.numeroFactura; document.getElementById('facturaFecha').value=f.fechaFactura; document.getElementById('facturaTotal').value=f.totalPagado; document.getElementById('facturaEstado').value=f.estado; document.getElementById('facturaAlquilerId').value=(f.detalles && f.detalles[0] && f.detalles[0].idAlquiler) || ''; window.scrollTo({top:0,behavior:'smooth'}); }
      });

      // seed sample
      (function(){
        const rows = Array.from(document.querySelectorAll('#factura-table-body tr'));
        rows.forEach(r=>{
          try{
            const id = r.children[0] && r.children[0].textContent.trim();
            const num = r.children[1] && r.children[1].textContent.trim();
            const fecha = r.children[2] && r.children[2].textContent.trim();
            const total = parseFloat((r.children[3] && r.children[3].textContent.replace('$','').trim())||0);
            const estado = r.children[4] && r.children[4].textContent.trim();
            const forma = r.children[5] && r.children[5].textContent.trim();
            const idAlq = r.children[6] && r.children[6].textContent.trim();
            const fp = window.crearFormaDePago(forma,'seed');
            const det = window.crearDetalleFactura(idAlq);
            const f = new Factura({id, numeroFactura:num, fechaFactura:fecha, totalPagado:total, estado:estado, detalles:[det], formaDePago:fp});
            facturaStore.push(f);
          }catch(e){}
        });
        reRenderFacturaTable();
      })();

    })();
  </script>
</body>

</html>
