spring.application.name=greedy_cars
spring.main.allow-bean-definition-overriding=true

# Fuente de datos (valores por defecto compatibles con H2 en memoria).
# Sobre-escriba con variables de entorno GREEDY_DB_* para apuntar a MariaDB u otro motor.
spring.datasource.url=${GREEDY_DB_URL:jdbc:h2:mem:greedy_cars;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${GREEDY_DB_USERNAME:sa}
spring.datasource.password=${GREEDY_DB_PASSWORD:}
spring.datasource.driver-class-name=${GREEDY_DB_DRIVER:org.h2.Driver}

# JPA/Hibernate
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.ddl-auto=${GREEDY_DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${GREEDY_DB_DIALECT:org.hibernate.dialect.H2Dialect}

server.port=9000

# Debug de Spring Security para ver flujo de autenticación en consola
logging.level.org.springframework.security=DEBUG
server.error.include-message=always
