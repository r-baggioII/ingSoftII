<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Admin | Empresas</title>
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/font-awesome.css}">
  <link rel="stylesheet" th:href="@{/assets/css/templatemo-training-studio.css}">
  <link rel="stylesheet" th:href="@{/assets/css/panel-shared.css}">
</head>
<body th:data-context-path="@{/}">
<header class="header-area header-sticky">
  <div class="container"><div class="row"><div class="col-12">
    <nav class="main-nav">
      <a th:href="@{/}" class="logo">Greedy<em> Gym</em></a>
      <ul class="nav">
        <li><a th:href="@{/dashboard/admin2}">Dashboard</a></li>
  <li><a th:href="@{/admin/empresas}">Empresas</a></li>
        <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
      </ul>
      <a class='menu-trigger'><span>Menú</span></a>
    </nav>
  </div></div></div>
</header>

<section class="section panel-management">
  <div class="container">
    <div class="row"><div class="col-lg-10 offset-lg-1">
      <div class="section-heading">
        <h2>Empresas</h2>
        <img th:src="@{/assets/images/line-dec.png}" alt="waves">
        <p>CRUD de empresas. Campos: nombre, teléfono y correo.</p>
      </div>
    </div></div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Crear/Editar Empresa</h5>
            <form id="empresa-form">
              <div class="mb-3">
                <label class="panel-label">Nombre comercial</label>
                <input type="text" class="form-control panel-control" name="nombre" required>
              </div>
              <div class="mb-3">
                <label class="panel-label">Teléfono</label>
                <input type="text" class="form-control panel-control" name="telefono" required>
              </div>
              <div class="mb-3">
                <label class="panel-label">Correo electrónico</label>
                <input type="email" class="form-control panel-control" name="correoElectronico" required>
              </div>
              <!-- JS: POST /api/empresas para crear; PUT /api/empresas/{id} para actualizar nombre -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn main-button-panel">Guardar</button>
                <button type="button" class="btn btn-outline-secondary" id="empresa-reset">Limpiar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-10 offset-lg-1">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Empresas</h5>
            <div class="input-group mb-3">
              <input type="text" id="empresa-search" class="form-control panel-control" placeholder="Buscar por nombre, teléfono o correo">
              <button class="btn main-button-panel" id="empresa-refresh">Buscar</button>
            </div>
            <!-- JS: GET /api/empresas ; acciones editar/borrar -->
            <div class="panel-table table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th class="text-end">Acciones</th></tr></thead>
                <tbody id="empresa-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script th:src="@{/assets/js/jquery-2.1.0.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/admin/empresas.js}"></script>
</body>
</html>
