<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Admin | Socios</title>
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/assets/css/font-awesome.css}">
  <link rel="stylesheet" th:href="@{/assets/css/templatemo-training-studio.css}">
  <link rel="stylesheet" th:href="@{/assets/css/panel-shared.css}">
</head>
<body th:data-context-path="@{/}">
<header class="header-area header-sticky">
  <div class="container"><div class="row"><div class="col-12">
    <nav class="main-nav">
      <a th:href="@{/}" class="logo">Greedy<em> Gym</em></a>
      <ul class="nav">
        <li><a th:href="@{/dashboard/admin2}">Dashboard</a></li>
  <li><a th:href="@{/admin/direcciones}">Direcciones</a></li>
        <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
      </ul>
      <a class='menu-trigger'><span>Menú</span></a>
    </nav>
  </div></div></div>
</header>

<section class="section panel-management">
  <div class="container">
    <div class="row"><div class="col-lg-10 offset-lg-1">
      <div class="section-heading">
        <h2>Socios</h2>
        <img th:src="@{/assets/images/line-dec.png}" alt="waves">
        <p>Alta, consulta, modificación y baja. Podés crear y vincular un usuario.</p>
      </div>
    </div></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Datos del Socio</h5>
            <form id="socio-form">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="panel-label">Nombre</label>
                  <input type="text" name="nombre" class="form-control panel-control" required>
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Apellido</label>
                  <input type="text" name="apellido" class="form-control panel-control" required>
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Fecha de nacimiento</label>
                  <input type="date" name="fechaNacimiento" class="form-control panel-control" required>
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Tipo de documento</label>
                  <select name="tipoDocumento" class="form-select panel-control" required>
                    <option value="DNI">DNI</option>
                    <option value="PASAPORTE">Pasaporte</option>
                    <option value="CEDULA">Cédula</option>
                    <option value="LIBRETA_CIVICA">Libreta Cívica</option>
                    <option value="LIBRETA_ENROLAMIENTO">Libreta de Enrolamiento</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Número de documento</label>
                  <input type="text" name="numeroDocumento" class="form-control panel-control" required>
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Teléfono</label>
                  <input type="text" name="telefono" class="form-control panel-control">
                </div>
                <div class="col-md-12">
                  <label class="panel-label">Correo electrónico</label>
                  <input type="email" name="correoElectronico" class="form-control panel-control">
                </div>
                <div class="col-md-6">
                  <label class="panel-label">Sucursal</label>
                  <select name="sucursalId" class="form-select panel-control">
                    <option value="">Seleccionar sucursal (opcional)</option>
                  </select>
                </div>
              </div>
              <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn main-button-panel">Guardar Socio</button>
                <button type="button" class="btn btn-outline-secondary" id="socio-reset">Limpiar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-10 offset-lg-1">
        <div class="card" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Usuario (opcional)</h5>
            <form id="socio-usuario-form">
              <div class="mb-2">
                <label class="panel-label">Nombre de usuario</label>
                <input type="text" name="nombreUsuario" class="form-control panel-control">
              </div>
              <div class="mb-2">
                <label class="panel-label">Clave</label>
                <input type="password" name="clave" class="form-control panel-control">
              </div>
              <div class="mb-3">
                <label class="panel-label">Rol</label>
                <select name="rol" class="form-select panel-control">
                  <option value="SOCIO">Socio</option>
                  <option value="PROFESOR">Profesor</option>
                  <option value="ADMINISTRATIVO">Administrativo</option>
                </select>
              </div>
              <button type="submit" class="btn main-button-panel">Crear y vincular Usuario</button>
            </form>
          </div>
        </div>

        <div class="card mt-4" style="border:none; border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.08);">
          <div class="card-body">
            <h5 class="card-title">Buscar Socios</h5>
            <div class="input-group mb-3">
              <input type="text" id="socio-search" class="form-control panel-control" placeholder="Buscar por nombre, DNI o correo">
              <button class="btn main-button-panel" id="socio-refresh">Buscar</button>
            </div>
            <div class="panel-table table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Nombre</th><th>DNI</th><th>Correo</th><th class="text-end">Acciones</th></tr></thead>
                <tbody id="socio-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script th:src="@{/assets/js/jquery-2.1.0.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/admin/socios.js}"></script>
</body>
</html>
