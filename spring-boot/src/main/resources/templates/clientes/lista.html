<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link active" href="/clientes">Clientes</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Listado de Clientes</h2>

    <form method="get" action="/clientes" class="mb-3">
        <div class="input-group">
            <input type="text" name="busqueda" class="form-control" placeholder="Buscar por apellido" th:value="${busqueda}">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
            <a href="/clientes" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <a href="/clientes/nuevo" class="btn btn-primary mb-3">Nuevo Cliente</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Domicilio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.id}"></td>
            <td th:text="${cliente.apellido}"></td>
            <td th:text="${cliente.dni}"></td>
            <td th:text="${cliente.nombre}"></td>
            <td th:text="${cliente.domicilio.nombreCalle + ' ' + cliente.domicilio.numero}"></td>
            <td>
                <a th:href="@{'/clientes/editar/' + ${cliente.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/clientes/eliminar/' + ${cliente.id}}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" class="text-center">No se encontraron clientes.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
