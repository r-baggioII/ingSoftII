<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Domicilio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/domicilios">Domicilios</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${domicilio.id} == null ? 'Nuevo Domicilio' : 'Editar Domicilio'"></h2>

    <form th:action="@{/domicilios/guardar}" th:object="${domicilio}" method="post">
        <div class="mb-3">
            <label for="nombreCalle" class="form-label">Nombre de la Calle</label>
            <input type="text" id="nombreCalle" name="nombreCalle" class="form-control" th:field="*{nombreCalle}">
            <div class="text-danger" th:if="${#fields.hasErrors('nombreCalle')}" th:errors="*{nombreCalle}"></div>
        </div>
        <div class="mb-3">
            <label for="numero" class="form-label">Número</label>
            <input type="number" id="numero" name="numero" class="form-control" th:field="*{numero}" min="1">
            <div class="text-danger" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/domicilios" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
