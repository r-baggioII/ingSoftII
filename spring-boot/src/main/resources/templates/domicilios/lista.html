<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Domicilios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link active" href="/domicilios">Domicilios</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Listado de Domicilios</h2>

    <a href="/domicilios/nuevo" class="btn btn-primary mb-3">Nuevo Domicilio</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Calle</th>
            <th>Número</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="domicilio : ${domicilios}">
            <td th:text="${domicilio.id}"></td>
            <td th:text="${domicilio.nombreCalle}"></td>
            <td th:text="${domicilio.numero}"></td>
            <td>
                <a th:href="@{'/domicilios/editar/' + ${domicilio.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/domicilios/eliminar/' + ${domicilio.id}}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar este domicilio?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(domicilios)}">
            <td colspan="4" class="text-center">No se encontraron domicilios.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
