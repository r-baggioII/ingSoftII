<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/domicilios">Domicilios</a></li>
                <li class="nav-item"><a class="nav-link" href="/facturas">Facturas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${factura.id} == null ? 'Nueva Factura' : 'Editar Factura'"></h2>

    <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post">
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="text" id="fecha" name="fecha" class="form-control" th:field="*{fecha}">
            <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
        </div>
        <div class="mb-3">
            <label for="numero" class="form-label">Número</label>
            <input type="number" id="numero" name="numero" class="form-control" th:field="*{numero}" min="1">
            <div class="text-danger" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
        </div>
        <div class="mb-3">
            <label for="total" class="form-label">Total</label>
            <input type="number" id="total" name="total" class="form-control" th:field="*{total}" min="0">
            <div class="text-danger" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></div>
        </div>
        <div class="mb-3">
            <label for="cliente" class="form-label">Cliente</label>
            <select id="cliente" name="cliente.id" class="form-select" th:field="*{cliente.id}">
                <option th:each="cli : ${clientes}" th:value="${cli.id}" th:text="${cli.nombre + ' ' + cli.apellido}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/facturas" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
