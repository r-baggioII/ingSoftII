<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/domicilios">Domicilios</a></li>
                <li class="nav-item"><a class="nav-link active" href="/facturas">Facturas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Listado de Facturas</h2>

    <a href="/facturas/nuevo" class="btn btn-primary mb-3">Nueva Factura</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Número</th>
            <th>Total</th>
            <th>Cliente</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="factura : ${facturas}">
            <td th:text="${factura.id}"></td>
            <td th:text="${factura.fecha}"></td>
            <td th:text="${factura.numero}"></td>
            <td th:text="${factura.total}"></td>
            <td th:text="${factura.cliente.nombre + ' ' + factura.cliente.apellido}"></td>
            <td>
                <a th:href="@{'/facturas/editar/' + ${factura.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/facturas/eliminar/' + ${factura.id}}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar esta factura?');">Eliminar</a>
                <a th:href="@{'/facturas/detalles/' + ${factura.id}}" class="btn btn-sm btn-info">Detalles</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(facturas)}">
            <td colspan="6" class="text-center">No se encontraron facturas.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
