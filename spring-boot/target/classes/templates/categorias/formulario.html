<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${categoria.id} == null ? 'Nueva Categoría' : 'Editar Categoría'"></h2>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
        <div class="mb-3">
            <label for="denominacion" class="form-label">Denominación</label>
            <input type="text" id="denominacion" name="denominacion" class="form-control" th:field="*{denominacion}">
            <div class="text-danger" th:if="${#fields.hasErrors('denominacion')}" th:errors="*{denominacion}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/categorias" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
