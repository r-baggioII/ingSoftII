<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/categorias">Categorías</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Listado de Categorías</h2>

    <form method="get" action="/categorias" class="mb-3">
        <div class="input-group">
            <input type="text" name="busqueda" class="form-control" placeholder="Buscar por denominación" th:value="${busqueda}">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
            <a href="/categorias" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <a href="/categorias/nuevo" class="btn btn-primary mb-3">Nueva Categoría</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Denominación</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}"></td>
            <td th:text="${categoria.denominacion}"></td>
            <td>
                <a th:href="@{'/categorias/editar/' + ${categoria.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/categorias/eliminar/' + ${categoria.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Seguro que deseas eliminar esta categoría?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="text-center">No se encontraron categorías.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
