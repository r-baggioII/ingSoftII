<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Detalle de Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MiniMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/articulos">Artículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/categorias">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/domicilios">Domicilios</a></li>
                <li class="nav-item"><a class="nav-link" href="/facturas">Facturas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${detalleFactura.id} == null ? 'Nuevo Detalle' : 'Editar Detalle'"></h2>

    <form th:action="@{/detallesfactura/guardar}" th:object="${detalleFactura}" method="post">
        <input type="hidden" th:field="*{factura.id}">

        <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" class="form-control" th:field="*{cantidad}" min="1">
            <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
        </div>

        <div class="mb-3">
            <label for="subtotal" class="form-label">Subtotal</label>
            <input type="number" id="subtotal" name="subtotal" class="form-control" th:field="*{subtotal}" min="0">
            <div class="text-danger" th:if="${#fields.hasErrors('subtotal')}" th:errors="*{subtotal}"></div>
        </div>

        <div class="mb-3">
            <label for="articulo" class="form-label">Artículo</label>
            <select id="articulo" name="articulo.id" class="form-select" th:field="*{articulo.id}">
                <option th:each="art : ${articulos}" th:value="${art.id}" th:text="${art.denominacion}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('articulo')}" th:errors="*{articulo}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{'/facturas/detalles/' + ${detalleFactura.factura.id}}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
